appId: com.yanzhi.desktop
productName: 言智
directories:
  output: ../../dist-release
# 同 lite：原生模块 ABI 由 fix-sqlite-binding.cjs（postinstall）处理，跳过 node-gyp 重编译
npmRebuild: false
files:
  - dist/**/*
  - main.cjs
  - preload.cjs
  - browser-preload.cjs
extraResources:
  - from: ../server/dist
    to: server/dist
  - from: ../server/src
    to: server/src
  - from: runtime/server-runtime/node_modules
    to: server/node_modules
  - from: ../server/package.json
    to: server/package.json

  - from: ../../assets/icons/icon.ico
    to: icon.ico
win:
  target: nsis
  icon: ../../assets/icons/icon.ico
mac:
  target: dmg
  icon: ../../assets/icons/icon.icns
  # CI 上无开发者证书，走 ad-hoc 签名；关闭 hardenedRuntime/gatekeeperAssess 以免卡在校验
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  target: AppImage
  icon: ../../assets/icons/icon.png
nsis:
  # 关闭一键安装，改为标准安装向导（可选目录、下一步）
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: ../../assets/icons/icon.ico
  uninstallerIcon: ../../assets/icons/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
