appId: com.yanzhi.desktop
productName: yan-zhi
directories:
  # 默认输出到仓库根 dist-release；可用 YZ_OUTPUT_DIR 覆盖（绕开被占用的旧 win-unpacked）。
  # 详见 electron-builder.lite.yml 同位置注释。
  output: ${env.YZ_OUTPUT_DIR}
# 同 lite：原生模块 ABI 由 fix-sqlite-binding.cjs（postinstall）处理，跳过 node-gyp 重编译
npmRebuild: false
# 安全加固：只从 app.asar 加载（配合 afterPack 写入的 OnlyLoadAppFromAsar fuse）。
asar: true
# 打包后、出安装包前：清理后端 sourcemap/.d.ts，并写入安全 fuses。
afterPack: ./electron-builder.after-pack.cjs
files:
  - dist/**/*
  - main.cjs
  - preload.cjs
  - browser-preload.cjs
  - snip-preload.cjs
  - snip-overlay.html
  - snip-overlay.js
  # ★★ 启动加载壳（2026-10-12）：健康检查期间显示，漏登记 = 打包版 splash 加载失败（白屏壳）
  - splash.html
  - splash-preload.cjs
  - keyring-crypto.cjs
  # ★★ 实例配置单一真相源（端口 / userData / 共享目录）：main.cjs 第 10 行 require('./instance.cjs')。
  #   漏登记 = 打包版启动即崩（Error: Cannot find module './instance.cjs'）——
  #   与 keyring-crypto.cjs 同一类坑：新增 .cjs 模块必须同步登记进本 files: 段。
  - instance.cjs
  # ★★ 外链协议白名单（2026-10-08）：main.cjs require('./url-guard.cjs')，四处 openExternal /
  #   guest will-navigate 闸门都靠它。漏登记 = 打包版启动即崩（Cannot find module './url-guard.cjs'），
  #   且「页面自定义协议（bitbrowser://）弹系统框」的修复会完全失效。
  - url-guard.cjs
  # 收藏夹导入（2026-10-23）：main.cjs require('./bookmarks-import.cjs')，
  #   漏登记 = 打包版启动即崩（Cannot find module './bookmarks-import.cjs'）。
  - bookmarks-import.cjs
  # ★★★ 桥路径同 tab 动作串行（2026-10-14）：main.cjs 模块级 require('./browser-op-chain.cjs')，
  #   消除"超时后上一个动作仍在跑、模型又发下一个"造成的同页并发打架。
  #   漏登记 = 打包版**启动即崩**（Cannot find module './browser-op-chain.cjs'）
  #   —— 与 keyring-crypto.cjs / instance.cjs 同一类坑（本次正是守门测试抓出来的）。
  - browser-op-chain.cjs
  # ★★★ 浏览器桥（2026-10-10，执行面直连化）：main.cjs require('./browser-bridge.cjs')，
  #   服务端经 loopback 端点直连浏览器执行面。漏登记 = 打包版**启动即崩**
  #   （Cannot find module './browser-bridge.cjs'）——与 keyring-crypto.cjs / instance.cjs 同一类坑。
  #   注意：桥**默认档位 off**（YZ_BROWSER_BRIDGE 未设时不启动端点）⇒ 登记了也不改变现有行为。
  - browser-bridge.cjs
  # ★★★ 执行目标解析纯函数（2026-10-10，执行面直连化）：main.cjs require('./browser-target.cjs')，
  #   多页语义（显式 tabId / new_tab 是否改写当前操作页）的**唯一判定**。
  #   漏登记 = 打包版**启动即崩**（Cannot find module './browser-target.cjs'）——同 browser-bridge.cjs。
  - browser-target.cjs
  # ★★★ 浏览器扩展管理器（P1，2026-10-19）：main.cjs 顶层 require('./browser-extensions.cjs')。
  #   漏登记 = 打包版**启动即崩**（Cannot find module './browser-extensions.cjs'）——同 browser-bridge.cjs。
  #   由 packaged-entry-modules.test.cjs 守门。
  - browser-extensions.cjs
  # ★★★ 商店下载代理适配 + 精选白名单（P2，2026-10-19）：main.cjs 顶层 require。
  #   漏登记 = 打包版启动即崩。
  - proxy-fetch.cjs
  - extension-whitelist.cjs
  # ★★★ 扩展右键菜单（P3，2026-10-19）：main.cjs 顶层 require('./extension-context-menus.cjs')；
  #   preload 由 registerExtensionPreload 按绝对路径注册，漏登记 = 扩展 contextMenus 全部失效。
  - extension-context-menus.cjs
  - extension-actions.cjs
  - extension-scripting.cjs
  - extension-cookies.cjs
  - extension-web-navigation.cjs
  - extension-api.preload.cjs
  # ★★★ 主进程/渲染层日志落盘（2026-10-10 新增）：main.cjs 顶层 require('./main-log.cjs')。
  #   漏登记 = 打包版**启动即崩**（Cannot find module './main-log.cjs'）——同 browser-bridge.cjs。
  #   ★ 由 packaged-entry-modules.test.cjs 守门（本次就是它抓出来的）。
  - main-log.cjs
  # 版本档配置（scripts/set-edition.cjs 生成）：main.cjs 运行时读它拿构建档与预置码档。
  # ★ 漏登记 = 打包版读不到档位 → 落到兜底档（basic），且「阉割版只有办公」这条会静默失效。
  - edition.json
  # ★★★ 插件前端包装载协议（mode-pluginization P0）：main.cjs require('./plugin-protocol.cjs')。
  #   漏登记 = 打包版启动即崩（Cannot find module './plugin-protocol.cjs'）——同 instance.cjs 类坑。
  - plugin-protocol.cjs
  # 共享依赖 shim（scripts/generate-host-shims.mjs 生成，随包分发）：yz://shared/*.mjs 由
  # protocol.handle 从 app.asar 内本目录读取。漏登记 = 插件前端装载全部 404。
  - host-shims/**/*
  # ── 体积裁剪（2026-10-08 实测 asar 145.5MB / 14938 条目后定向排除）──
  # ★ sourcemap：仅调试用，运行时不加载。实测 3844 个文件共 **45MB**，
  #   占 asar 的 30%+（element-plus / lucide-vue-next / three 三家为主）。
  - '!**/*.js.map'
  - '!**/*.mjs.map'
  - '!**/*.cjs.map'
  - '!**/*.css.map'
  # ★ 原生模块的**源码**：better-sqlite3/deps/ 下是 sqlite3 的 amalgamation
  #   （sqlite3.c 单文件 8.8MB），实测 10 个文件共 **9.5MB**。
  #   发行包只需编译好的 better_sqlite3.node —— 它在 app.asar.unpacked 里，不走本段。
  - '!**/node_modules/better-sqlite3/deps/**'
  # ★ TS 声明与来源映射：运行时不读。实测 138 个 *.d.ts.map（0.1MB）。
  - '!**/*.d.ts'
  - '!**/*.d.ts.map'
  # 合计实测可省 ≈54.5MB（asar 的 37.5%）。
# ★ 语言包裁剪（与 lite/mac 一致，packaged-entry-modules.test.cjs 守门三份一致）：
#   缺这段 = full/pro 档随包 Electron 全部语言包（实测 41MB）。
electronLanguages:
  - zh-CN
  - en-US
extraResources:
  - from: ../server/dist
    to: server/dist
    # ★ extraResources 不走 files: 的排除规则，必须在这里再挡一次。
    #   afterPack 还会兜底删除并断言（双保险）。
    filter:
      - '**/*'
      - '!**/*.map'
      - '!**/*.d.ts'
  - from: ../server/assets
    to: server/assets
  # ★★ 内置插件包（mode-pluginization P1）：build-all-editions 先经 build-plugins.mjs 生成
  #   apps/server/plugins/builtin/<id>/，这里整体拷进包。运行时由 builtin-packages.ts 扫描
  #   resources/server/dist/plugins/builtin 装载（包优先、源码兜底）。
  #   P5 起改为按 --plugins 选择拷贝（未选插件的目录不进包）。
  - from: ../server/plugins/builtin
    to: server/dist/plugins/builtin
  # ★ 刻意**不打包** ../server/src（后端源码）。
  #   原先是随包的，但生产模式只运行 server/dist/... 的编译产物（见 main.cjs 的 serverPath），
  #   全仓没有任何代码读 resources/server/src —— 它随包等于把后端源码（含 license.ts 的
  #   验签逻辑与公钥）明文交给客户，改一行就能绕过授权。删掉它既减体积又堵住这条最实的绕过路径。
  - from: runtime/server-runtime/node_modules
    to: server/node_modules
  - from: ../server/package.json
    to: server/package.json
  # 局域网访问：前端静态资源（dist）复制一份到 server 可访问路径，由后端 express.static 托管
  - from: dist
    to: server/web-dist
  # 预置试用码（构建时现签，scripts/pre-sign-license.cjs 产出；运行时经 YZ_LICENSE_CODES_FILE 读取）
  - from: resources/license
    to: license

  # 内置 Python 运行时（python-build-standalone，离线可用）—— 由 scripts/build-python-runtime.mjs 生成
  - from: resources/python
    to: python
  # 随包 Python 脚本（doyz / security / pdf_preview）+ 预烤依赖（同目录 site-packages）
  - from: resources/python-tools
    to: python-tools

  # 注：ffmpeg 不随包。改为运行时按平台从官方静态构建源下载到数据目录（<dataDir>/ffmpeg），
  # 由 api_tool_executor 的 media_install_ffmpeg 触发。理由：随包要为每个平台预置二进制
  # （体积 +~200MB，且 mac/linux 构建无法在 Windows CI 上准备），按需下载各平台各取所需。

  - from: ../../assets/icons/icon.ico
    to: icon.ico
# ── 体积裁剪：Electron 自带全部语言包，实测 locales/ 占 41MB ──
# ★ 本项目界面全中文（部分英文术语），原本只保留简体中文 + 英文（历史注释见下）。
# ★★★ 2026-10-17：electron-builder 打包时会**按 electronLanguages 批量删除其余 ~50 个 .pak**，
#   该批量删除触发沙箱 safe-delete 的 SAFE_DELETE_BULK_CONFIRM_REQUIRED（阈值 50）直接中断打包。
#   electron-builder 25 没有 removeUnusedLanguages 开关，**故不再限制语言（保留全部语言包）**。
#   安装包体积影响可忽略（locales 在 NSIS 里压缩得动），且彻底消除语言回退白屏风险。
#   历史注释：Chromium 缺对应语言包时会回退 en-US，即使误设也不会白屏；该项原属可选项
#   （主要省解开后的磁盘占用与分发解压耗时）。如需恢复裁剪，须先确认能绕过该批量删除守卫。
win:
  target: nsis
  icon: ../../assets/icons/icon.ico
mac:
  target: dmg
  icon: ../../assets/icons/icon.icns
  # CI 上无开发者证书，走 ad-hoc 签名；关闭 hardenedRuntime/gatekeeperAssess 以免卡在校验
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  target: AppImage
  icon: ../../assets/icons/icon.png
nsis:
  # 安装/卸载时清理 Windows 图标缓存（避免任务栏显示旧版应用图标）
  include: build/installer.nsh
  # 关闭一键安装，改为标准安装向导（可选目录、下一步）
  oneClick: false
  # perMachine=true：安装到 C:\Program Files\（覆盖旧版，需要管理员权限）
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 快捷方式显示名（桌面/开始菜单），productName 保持英文用于安装目录和安装包文件名
  shortcutName: 言智
  installerIcon: ../../assets/icons/icon.ico
  uninstallerIcon: ../../assets/icons/icon.ico
  # 产物名带版本档后缀（lite / basic / pro），由 scripts/set-edition.cjs → electron-build.cjs
  # 以环境变量注入。三档共用本文件，靠 edition.json 区分，避免三份 yml 逐行漂移。
  # 注：${env.X} 在变量缺失时 electron-builder 会直接报错而非忽略，故 electron-build.cjs
  # 里做了 '-basic' 兜底，不会出现未定义的情况。
  artifactName: ${productName}-Setup-${version}-${arch}${env.YZ_ARTIFACT_SUFFIX}.${ext}
