# 轻量前端壳（无后端）：连远程 yan-zhi 后端使用的桌面壳。
# 与 electron-builder.full.yml 的唯一本质差异：extraResources 不含 server/*（后端产物、
# 内置插件、python 运行时、预置码）。main.cjs 检测 resources/server 缺失 → 跳过后端启动，
# 前端在登录页/初始化页填「服务器地址」（localStorage yz_server_base）连远程节点。
#
# ★ files: 段必须与 full.yml 保持同步（main.cjs 顶层 require 的每个 .cjs 都要登记，
#   漏登记 = 打包版启动即崩，见 packaged-entry-modules.test.cjs 的守门注释）。
appId: com.yanzhi.shell
productName: yan-zhi-shell
directories:
  output: ${env.YZ_OUTPUT_DIR}
npmRebuild: false
asar: true
afterPack: ./electron-builder.after-pack.cjs
files:
  - dist/**/*
  - main.cjs
  - preload.cjs
  - browser-preload.cjs
  - snip-preload.cjs
  - snip-overlay.html
  - snip-overlay.js
  - splash.html
  - splash-preload.cjs
  - keyring-crypto.cjs
  - instance.cjs
  - url-guard.cjs
  - bookmarks-import.cjs
  - browser-op-chain.cjs
  - browser-bridge.cjs
  - browser-target.cjs
  - tab-keepalive.cjs
  - pet-dock.cjs
  - popup-dismiss.cjs
  - clipboard-store.cjs
  - browser-extensions.cjs
  - proxy-fetch.cjs
  - extension-whitelist.cjs
  - extension-context-menus.cjs
  - extension-actions.cjs
  - extension-scripting.cjs
  - extension-cookies.cjs
  - extension-web-navigation.cjs
  - extension-api.preload.cjs
  - main-log.cjs
  - edition.json
  - plugin-protocol.cjs
  - desktop-shell.cjs
  - plugin-hotkeys.cjs
  - host-shims/**/*
  - '!**/*.js.map'
  - '!**/*.mjs.map'
  - '!**/*.cjs.map'
  - '!**/*.css.map'
  - '!**/*.d.ts'
  - '!**/*.d.ts.map'
# 语言包：同 full（2026-10-17 批量删除会触发沙箱守卫，故不裁剪）
win:
  target: nsis
  icon: ../../assets/icons/icon.ico
mac:
  target: dmg
  icon: ../../assets/icons/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  target: AppImage
  icon: ../../assets/icons/icon.png
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 言智壳
  installerIcon: ../../assets/icons/icon.ico
  uninstallerIcon: ../../assets/icons/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}${env.YZ_ARTIFACT_SUFFIX}.${ext}
extraResources:
  # 内置后端地址（轻量壳开箱直连）：打包前改 resources/server-base.json 的 serverBase。
  # 仅壳模式生效（resources/server 缺失）；空串 = 不内置，用户登录页手填。
  - from: resources/server-base.json
    to: server-base.json
  - from: ../../assets/icons/icon.ico
    to: icon.ico
