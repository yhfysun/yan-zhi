<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>yan-zhi 截图</title>
<style>
  /* 透明实时遮罩：窗口透明，实时屏幕透过可见；暗幕/选区阴影负责「屏幕变暗」 */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; }
  html { background: transparent; }
  /* ★ 不可删：Windows 透明窗的命中测试按「像素 alpha」判定 —— alpha=0 的像素点击会直接
     穿透到下层应用，把它激活，本窗随即收到 blur 被取消（表现为「单击就退出」，且在
     show 后 500ms 的 armedAt 保护期内外行为不一致，所以感觉「不稳定」）。
     而 #dim / #winHi / #sel 恰恰都用「挖洞」方式留出全透明区域压暗四周，
     洞的位置正是用户要点击的位置（窗口矩形内 / 选区内）→ 必然穿透。
     这里给 body 铺一层 1.2% 的近乎不可见基底（视觉上等同全透明），
     保证任何像素 alpha 都 > 0，从根上堵死穿透。删掉这行 Windows 上必现该 bug。 */
  body { background: rgba(0, 0, 0, 0.012); }
  #dim { position: absolute; inset: 0; z-index: 1; background: rgba(0, 0, 0, 0.45); pointer-events: none; }
  #ink, #preview { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  #preview { z-index: 3; }
  /* 经典手法：选区 div 用超大 box-shadow 把选区外的画面压暗，免去四块遮罩拼接 */
  #sel { position: absolute; display: none; border: 1.5px solid #3b82f6; box-shadow: 0 0 0 100000px rgba(0, 0, 0, 0.45); z-index: 10; }
  #badge { position: absolute; display: none; z-index: 11; background: rgba(24, 24, 27, 0.92); color: #fff; font: 12px/1 -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; padding: 5px 8px; border-radius: 4px; pointer-events: none; white-space: nowrap; }
  #hint { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 12; background: rgba(24, 24, 27, 0.92); color: #e5e7eb; font: 13px/1.4 -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; padding: 8px 16px; border-radius: 8px; pointer-events: none; white-space: nowrap; }
  #hint b { color: #60a5fa; font-weight: 600; }
  /* 标注工具条（QQ 式）：选区下方浮现 */
  #toolbar {
    position: absolute; display: none; z-index: 13;
    background: rgba(24, 24, 27, 0.95); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 6px 8px;
    align-items: center; gap: 2px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  .tb-btn {
    width: 30px; height: 30px; border: none; border-radius: 7px;
    background: transparent; color: #d4d4d8; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .tb-btn:hover { background: rgba(255,255,255,0.10); color: #fff; }
  .tb-btn.active { background: #3b82f6; color: #fff; }
  .tb-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tb-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.14); margin: 0 5px; }
  .tb-color { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; margin: 0 2px; }
  .tb-color.active { border-color: #fff; box-shadow: 0 0 0 1.5px rgba(24,24,27,0.95); }
  /* 文字标注编辑框 */
  #textEdit {
    position: absolute; display: none; z-index: 14;
    background: rgba(0,0,0,0.25); border: 1.5px dashed #9ca3af; border-radius: 4px;
    font: 500 16px/1.4 -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    color: #ff4d4f; padding: 4px 6px; margin: 0; min-width: 140px; outline: none;
  }
  /* 微信式窗口识别：hover 高亮 + 窗口标题气泡（窗口区域亮出、窗外压暗） */
  #winHi {
    position: absolute; display: none; z-index: 9; pointer-events: none;
    border: 2px solid #3b82f6; border-radius: 2px;
    box-shadow: 0 0 0 100000px rgba(0, 0, 0, 0.45);
  }
  #winTitle {
    position: absolute; display: none; z-index: 9; pointer-events: none;
    background: rgba(24, 24, 27, 0.92); color: #e5e7eb;
    font: 12px/1.4 -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    padding: 4px 10px; border-radius: 6px; white-space: nowrap;
    max-width: 40vw; overflow: hidden; text-overflow: ellipsis;
  }
  /* 微信式选区 8 向手柄：白底蓝边小方块，压在选区边框上 */
  .handle {
    position: absolute; display: none; z-index: 12;
    width: 10px; height: 10px; background: #fff; border: 1.5px solid #3b82f6;
    border-radius: 2px; box-sizing: border-box; pointer-events: auto;
  }
</style>
</head>
<body>
<div id="dim"></div>
<canvas id="ink"></canvas>
<canvas id="preview"></canvas>
<div id="sel"></div>
<div id="winHi"></div>
<div id="winTitle"></div>
<div id="badge"></div>
<div id="hint">移动到窗口上自动识别 · <b>单击</b>选中整窗或拖拽框选 · 选区内<b>拖动</b>调整位置 · <b>双击 / Enter</b> 确认 · <b>Esc / 右键</b> 取消</div>
<div id="toolbar"></div>
<input id="textEdit" spellcheck="false" />
<script src="snip-overlay.js"></script>
</body>
</html>
