<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>言智 · 远控中</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden;
    font: 13px/1.4 system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  .card {
    position: absolute; inset: 6px; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; border-radius: 14px; color: #e8eef7;
    background: linear-gradient(180deg, rgba(24, 29, 38, .97), rgba(16, 20, 27, .97));
    border: 1px solid rgba(255, 255, 255, .10);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
    /* 整卡可拖动；按钮区单独 no-drag */
    -webkit-app-region: drag;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; background: #ff4d5e; flex: 0 0 auto;
    box-shadow: 0 0 0 3px rgba(255, 77, 94, .18);
    animation: rcPulse 1.6s ease-in-out infinite;
  }
  @keyframes rcPulse { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
  .meta { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .title { font-size: 12px; letter-spacing: .4px; color: #a7b3c4; display: flex; align-items: center; }
  .title b { color: #fff; font-weight: 600; margin-left: 4px; }
  .badge {
    margin-left: 6px; font-size: 10px; font-weight: 400; padding: 1px 5px; border-radius: 5px;
    background: rgba(255, 180, 60, .16); color: #ffc46b;
  }
  .device { font-size: 12px; color: #dfe7f1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { font-variant-numeric: tabular-nums; font-size: 12px; color: #8fa0b5; flex: 0 0 auto; }
  .actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; -webkit-app-region: no-drag; }
  .btn {
    border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .06); color: #dfe7f1;
    border-radius: 9px; padding: 5px 9px; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: rgba(255, 255, 255, .12); }
  .btn.danger { border-color: rgba(255, 77, 94, .45); background: rgba(255, 77, 94, .14); color: #ff9aa4; }
  .btn.danger:hover { background: rgba(255, 77, 94, .24); }
  /* 收起态：窗口只有 10px 宽 —— 内容全部隐藏，只留一条竖直高亮条 */
  body.collapsed .card {
    inset: 0; padding: 0; justify-content: center; border-radius: 8px;
    background: linear-gradient(180deg, rgba(255, 77, 94, .9), rgba(190, 40, 55, .9));
  }
  body.collapsed .meta,
  body.collapsed .time,
  body.collapsed .actions,
  body.collapsed .dot { display: none; }
</style>
</head>
<body>
<div class="card">
  <span class="dot"></span>
  <div class="meta">
    <div class="title">远控中<b id="badge" hidden></b></div>
    <div class="device" id="device">未知设备</div>
  </div>
  <div class="time" id="time">00:00</div>
  <div class="actions">
    <button class="btn" id="min" title="收起到屏幕边缘，鼠标移上去再展开">收起</button>
    <button class="btn danger" id="stop">断开</button>
  </div>
</div>
<script type="module" src="/src/rc-card-main.ts"></script>
</body>
</html>
