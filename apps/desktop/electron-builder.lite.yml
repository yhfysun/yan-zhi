appId: com.yanzhi.desktop
productName: yan-zhi
directories:
  output: ../../dist-release
# 跳过 electron-builder 的原生模块重编译（node-gyp）：
#  - better-sqlite3 的 Electron ABI 由 postinstall 的 fix-sqlite-binding.cjs 拉取预编译处理
#  - sqlite-vec / esbuild 为 N-API 预编译，无需重编译
#  - 否则 canvas（unpdf 的可选依赖）会被扫描到并在 Windows 上因缺 MSVC 编译失败
npmRebuild: false
files:
  - dist/**/*
  - main.cjs
  - preload.cjs
  - browser-preload.cjs
extraResources:
  - from: ../server/dist
    to: server/dist
  - from: ../server/assets
    to: server/assets
  - from: ../server/src
    to: server/src
  - from: runtime/server-runtime/node_modules
    to: server/node_modules
  - from: ../server/package.json
    to: server/package.json
  # 局域网访问：前端静态资源（dist）复制一份到 server 可访问路径，由后端 express.static 托管
  - from: dist
    to: server/web-dist

  # 内置 Python 运行时（python-build-standalone，离线可用）—— 由 scripts/build-python-runtime.mjs 生成
  - from: resources/python
    to: python
  # 随包 Python 脚本（doyz / security / pdf_preview）+ 预烤依赖（同目录 site-packages）
  - from: resources/python-tools
    to: python-tools

  - from: ../../assets/icons/icon.ico
    to: icon.ico
win:
  target: nsis
  icon: ../../assets/icons/icon.ico
mac:
  target: dmg
  icon: ../../assets/icons/icon.icns
  # CI 上无开发者证书，走 ad-hoc 签名；关闭 hardenedRuntime/gatekeeperAssess 以免卡在校验
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  target: AppImage
  icon: ../../assets/icons/icon.png
nsis:
  # 安装/卸载时清理 Windows 图标缓存（避免任务栏显示旧版应用图标）
  include: build/installer.nsh
  # 关闭一键安装，改为标准安装向导（可选目录、下一步）
  oneClick: false
  # perMachine=true：安装到 C:\Program Files\（覆盖旧版，需要管理员权限）。
  # 之前误改为 false 导致装到 per-user 目录（%LOCALAPPDATA%\Programs），与旧版 Program Files 目录不一致，成了"重新装"而非"覆盖"。
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: ../../assets/icons/icon.ico
  uninstallerIcon: ../../assets/icons/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}-lite.${ext}
