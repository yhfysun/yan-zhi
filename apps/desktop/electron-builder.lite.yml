appId: com.yanzhi.desktop
productName: yan-zhi
directories:
  # 默认输出到仓库根 dist-release。可用环境变量 YZ_OUTPUT_DIR 覆盖 ——
  # 用途：上一次构建的 win-unpacked/app.asar 被占用（杀软扫描 / 残留进程）时，
  # electron-builder 会因删不掉旧 asar 而中断；换个输出目录即可绕开，不必等锁释放。
  output: ${env.YZ_OUTPUT_DIR}
# 跳过 electron-builder 的原生模块重编译（node-gyp）：
#  - better-sqlite3 的 Electron ABI 由 postinstall 的 fix-sqlite-binding.cjs 拉取预编译处理
#  - sqlite-vec / esbuild 为 N-API 预编译，无需重编译
#  - 否则 canvas（unpdf 的可选依赖）会被扫描到并在 Windows 上因缺 MSVC 编译失败
npmRebuild: false
files:
  - dist/**/*
  - main.cjs
  - preload.cjs
  - browser-preload.cjs
  - snip-preload.cjs
  - snip-overlay.html
  - snip-overlay.js
  - keyring-crypto.cjs
  # ★★ 实例配置单一真相源（端口 / userData / 共享目录）：main.cjs 第 10 行 require('./instance.cjs')。
  #   漏登记 = 打包版启动即崩（Error: Cannot find module './instance.cjs'）——
  #   与 keyring-crypto.cjs 同一类坑：新增 .cjs 模块必须同步登记进本 files: 段。
  - instance.cjs
  # ★★ 外链协议白名单（2026-10-08）：main.cjs require('./url-guard.cjs')，四处 openExternal /
  #   guest will-navigate 闸门都靠它。漏登记 = 打包版启动即崩（Cannot find module './url-guard.cjs'），
  #   且「页面自定义协议（bitbrowser://）弹系统框」的修复会完全失效。
  - url-guard.cjs
  # ★★★ 浏览器桥（2026-10-10，执行面直连化）：main.cjs require('./browser-bridge.cjs')，
  #   服务端经 loopback 端点直连浏览器执行面。漏登记 = 打包版**启动即崩**
  #   （Cannot find module './browser-bridge.cjs'）——与 keyring-crypto.cjs / instance.cjs 同一类坑。
  #   注意：桥**默认档位 off**（YZ_BROWSER_BRIDGE 未设时不启动端点）⇒ 登记了也不改变现有行为。
  - browser-bridge.cjs
  # ★★★ 执行目标解析纯函数（2026-10-10，执行面直连化）：main.cjs require('./browser-target.cjs')，
  #   多页语义（显式 tabId / new_tab 是否改写当前操作页）的**唯一判定**。
  #   漏登记 = 打包版**启动即崩**（Cannot find module './browser-target.cjs'）——同 browser-bridge.cjs。
  - browser-target.cjs
  # ★★★ 主进程/渲染层日志落盘（2026-10-10 新增）：main.cjs 顶层 require('./main-log.cjs')。
  #   漏登记 = 打包版**启动即崩**（Cannot find module './main-log.cjs'）——同 browser-bridge.cjs。
  #   ★ 由 packaged-entry-modules.test.cjs 守门（本次就是它抓出来的）。
  - main-log.cjs
  # 版本档配置（scripts/set-edition.cjs 生成）：main.cjs 运行时读它拿构建档与预置码档。
  # ★ 漏登记 = 打包版读不到档位 → 落到兜底档（basic），且「阉割版只有办公」这条会静默失效。
  - edition.json
  # ── 体积裁剪（与 electron-builder.full.yml 逐行一致，改一处必须同步另一处）──
  # ★ sourcemap 仅调试用，运行时不加载：实测 3844 个文件共 45MB（asar 的 30%+）。
  - '!**/*.js.map'
  - '!**/*.mjs.map'
  - '!**/*.cjs.map'
  - '!**/*.css.map'
  # ★ 原生模块源码（better-sqlite3/deps/ 下 sqlite3.c 单文件 8.8MB，共 9.5MB）：只需编译产物。
  - '!**/node_modules/better-sqlite3/deps/**'
  # ★ TS 声明与来源映射运行时不读（实测 138 个 *.d.ts.map）。
  - '!**/*.d.ts'
  - '!**/*.d.ts.map'
  # 合计实测可省 ≈54.5MB（asar 的 37.5%）。
extraResources:
  - from: ../server/dist
    to: server/dist
  - from: ../server/assets
    to: server/assets
  # ★ 刻意不打包 ../server/src（后端源码）：生产模式只跑 server/dist 的编译产物，
  #   源码随包 = 把 license.ts 验签逻辑明文交给客户。详见 full.yml 同位置注释。
  - from: runtime/server-runtime/node_modules
    to: server/node_modules
  - from: ../server/package.json
    to: server/package.json
  # 局域网访问：前端静态资源（dist）复制一份到 server 可访问路径，由后端 express.static 托管
  - from: dist
    to: server/web-dist
  # 预置试用码（构建时现签，scripts/pre-sign-license.cjs 产出；运行时经 YZ_LICENSE_CODES_FILE 读取）
  - from: resources/license
    to: license

  # 内置 Python 运行时（python-build-standalone，离线可用）—— 由 scripts/build-python-runtime.mjs 生成
  - from: resources/python
    to: python
  # 随包 Python 脚本（doyz / security / pdf_preview）+ 预烤依赖（同目录 site-packages）
  - from: resources/python-tools
    to: python-tools

  # 注：ffmpeg 不随包，运行时按平台按需下载到数据目录（见 media_install_ffmpeg）。

  - from: ../../assets/icons/icon.ico
    to: icon.ico
# ── 体积裁剪：只留界面用得到的中英语言包（Electron 自带全部语言包，locales/ 实测 41MB）──
# 与 electron-builder.full.yml 逐行一致；Chromium 缺语言包会回退 en-US，不会白屏。
electronLanguages:
  - zh-CN
  - en-US
win:
  target: nsis
  icon: ../../assets/icons/icon.ico
mac:
  target: dmg
  icon: ../../assets/icons/icon.icns
  # CI 上无开发者证书，走 ad-hoc 签名；关闭 hardenedRuntime/gatekeeperAssess 以免卡在校验
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  target: AppImage
  icon: ../../assets/icons/icon.png
nsis:
  # 安装/卸载时清理 Windows 图标缓存（避免任务栏显示旧版应用图标）
  include: build/installer.nsh
  # 关闭一键安装，改为标准安装向导（可选目录、下一步）
  oneClick: false
  # perMachine=true：安装到 C:\Program Files\（覆盖旧版，需要管理员权限）。
  # 之前误改为 false 导致装到 per-user 目录（%LOCALAPPDATA%\Programs），与旧版 Program Files 目录不一致，成了"重新装"而非"覆盖"。
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 快捷方式显示名（桌面/开始菜单），productName 保持英文用于安装目录和安装包文件名
  shortcutName: 言智
  installerIcon: ../../assets/icons/icon.ico
  uninstallerIcon: ../../assets/icons/icon.ico
  # 产物名带版本档后缀（lite / basic / pro），由 scripts/set-edition.cjs → electron-build.cjs
  # 以环境变量注入。本文件与 electron-builder.full.yml **内容等价**（逐行比对过，只差这一行），
  # 两份都保留只是历史命名习惯；新构建请用 .full.yml，或在脚本里明确指向其一。
  artifactName: ${productName}-Setup-${version}-${arch}${env.YZ_ARTIFACT_SUFFIX}.${ext}
