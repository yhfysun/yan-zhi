<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>言智 · 四模式布局原型</title>
<style>
  :root{
    --primary:#7c3aed; --primary-weak:#f3efff;
    --bg:#f4f5f9; --surface:#ffffff; --surface-2:#fafbfd;
    --line:#e7e9f0; --line-strong:#d5d9e4;
    --text:#1b2130; --text-2:#5a6278; --text-3:#9198ab;
    --office:#2563eb; --dev:#8b5cf6; --ops:#0d9488; --sec:#e11d48;
    --font:"Segoe UI","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:"Cascadia Code",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);overflow:hidden}
  .app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* ===================== 全局顶栏 ===================== */
  .topbar{height:38px;flex-shrink:0;display:flex;align-items:center;background:var(--surface);
    border-bottom:1px solid var(--line);user-select:none}
  .brand{display:flex;align-items:center;gap:7px;padding:0 12px 0 14px}
  .brand-logo{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-size:11px;font-weight:800}
  .brand-name{font-size:13px;font-weight:700}
  .nav{display:flex;align-items:center;gap:1px}
  .nav-item{display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:none;background:transparent;
    border-radius:7px;font-size:12.5px;font-family:inherit;color:var(--text-2);cursor:pointer;
    transition:background .15s,color .15s}
  .nav-item:hover{background:var(--surface-2);color:var(--text)}
  .spacer{flex:1;height:100%}
  .tb-right{display:flex;align-items:center;gap:4px;padding-right:6px}
  .avatar{width:24px;height:24px;border-radius:50%;background:var(--primary-weak);color:var(--primary);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .win-controls{display:flex}
  .win-btn{width:42px;height:38px;border:none;background:transparent;color:var(--text-2);cursor:pointer;font-size:12px}
  .win-btn:hover{background:#eef0f5}
  .win-btn.close:hover{background:#e81123;color:#fff}

  /* 模式下拉 = 原「任务」项原地升级 */
  .mode-switch{position:relative;display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;
    border:none;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;
    background:color-mix(in srgb,var(--mode-color) 12%,transparent);color:var(--mode-color);transition:background .15s}
  .mode-switch:hover{background:color-mix(in srgb,var(--mode-color) 19%,transparent)}
  .mode-switch .ms-dot{width:15px;height:15px;border-radius:4px;display:flex;align-items:center;justify-content:center;
    background:var(--mode-color);color:#fff;font-size:9px;font-weight:800}
  .mode-switch .ms-caret{font-size:8px;opacity:.7}
  .ms-menu{position:absolute;top:32px;left:0;width:266px;z-index:900;display:none;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(20,24,40,.16);padding:5px}
  .ms-menu.open{display:block}
  .ms-item{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer}
  .ms-item:hover{background:var(--surface-2)}
  .ms-item.active{background:var(--primary-weak)}
  .ms-ico{width:22px;height:22px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:10px;font-weight:800}
  .ms-txt{flex:1;min-width:0}
  .ms-name{font-size:12.5px;font-weight:600;display:block}
  .ms-desc{font-size:11px;color:var(--text-3);display:block;margin-top:1px}
  .ms-check{color:var(--primary);font-size:12px}

  /* ===================== 模式顶栏 ===================== */
  .mode-bar{height:36px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px;
    background:var(--surface);border-bottom:1px solid var(--line);font-size:12px}
  .badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:20px;
    background:color-mix(in srgb,var(--mode-color) 10%,#fff);color:var(--mode-color);
    font-size:11.5px;font-weight:600;border:1px solid color-mix(in srgb,var(--mode-color) 26%,#fff)}
  .badge-dot{width:6px;height:6px;border-radius:50%;background:var(--mode-color)}
  .bar-sep{width:1px;height:16px;background:var(--line)}
  .bar-spacer{flex:1}
  .bar-btn{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border:1px solid var(--line);
    background:var(--surface-2);border-radius:7px;font-size:11.5px;font-family:inherit;color:var(--text-2);
    cursor:pointer;white-space:nowrap}
  .bar-btn:hover{border-color:var(--mode-color);color:var(--mode-color)}
  .bar-btn.on{background:color-mix(in srgb,var(--mode-color) 10%,#fff);border-color:var(--mode-color);color:var(--mode-color)}
  .bar-btn b{font-weight:700;color:var(--text)}
  .chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;
    background:var(--surface-2);border:1px solid var(--line);font-size:11px;color:var(--text-2)}
  .chip b{font-weight:700;color:var(--text)}
  .chip.warn b{color:var(--sec)}

  /* ===================== 骨架（三栏） ===================== */
  .shell{flex:1;display:flex;min-height:0;overflow:hidden}
  .col{display:flex;flex-direction:column;min-height:0;min-width:0}
  .aside{width:238px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line)}
  .aside-head{height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--text-3);
    border-bottom:1px solid var(--line)}
  .aside-head .ah-act{color:var(--text-3);cursor:pointer;font-size:15px;line-height:1}
  .aside-head .ah-act:hover{color:var(--primary)}
  .aside-body{flex:1;overflow-y:auto;padding:6px 6px 14px;min-height:0}
  .handle{width:5px;flex-shrink:0;cursor:col-resize}
  .handle:hover{background:color-mix(in srgb,var(--primary) 22%,transparent)}
  .center{flex:1;background:var(--surface-2)}
  .center-head{height:34px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 8px;
    border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto}
  .center-body{flex:1;overflow:auto;padding:12px;min-height:0}

  /* 左栏项 */
  .grp{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;
    font-size:11.5px;font-weight:600;color:var(--text-2);margin-top:2px}
  .grp:hover{background:var(--surface-2)}
  .grp .g-caret{font-size:9px;color:var(--text-3);width:9px}
  .grp .g-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grp .g-count{font-size:10px;font-weight:500;color:var(--text-3)}
  .conv{display:flex;align-items:center;gap:7px;padding:6px 8px 6px 12px;border-radius:6px;cursor:pointer;
    font-size:12px;color:var(--text-2)}
  .conv:hover{background:var(--surface-2)}
  .conv.active{background:var(--primary-weak);color:var(--primary);font-weight:600}
  .conv-dot{width:5px;height:5px;border-radius:50%;background:var(--line-strong);flex-shrink:0}
  .conv.active .conv-dot{background:var(--primary)}
  .conv-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-time{font-size:10px;color:var(--text-3);flex-shrink:0}
  .divider{height:1px;background:var(--line);margin:8px 6px}
  .frow{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:6px;cursor:pointer;
    font-size:12px;color:var(--text-2);white-space:nowrap}
  .frow:hover{background:var(--surface-2)}
  .frow.active{background:var(--primary-weak);color:var(--primary);font-weight:600}
  .frow .fi{width:14px;flex-shrink:0;text-align:center;font-size:10.5px;opacity:.7}
  .frow .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .dot.ssh{background:#0ea5e9}.dot.docker{background:#2563eb}.dot.db{background:#f59e0b}
  .tag{font-size:9.5px;padding:1px 5px;border-radius:20px;flex-shrink:0}
  .tag.prod{background:#fff1f2;color:#e11d48;border:1px solid #ffd9de}
  .tag.ok{background:#ecfdf5;color:#0d9488;border:1px solid #cdf3e8}
  .tag.exp{background:#f4f4f6;color:#9198ab;border:1px solid #e4e6ec}

  /* ===================== 对话（共用） ===================== */
  .chat{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
  .chat-head{height:34px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 11px;
    border-bottom:1px solid var(--line);background:var(--surface)}
  .t-title{font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:6px}
  .msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
  .msg{max-width:94%;font-size:12px;line-height:1.68;padding:8px 11px;border-radius:9px;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:3px}
  .msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
  .msg.ai code{font-family:var(--mono);font-size:11px;background:#eceef5;padding:1px 4px;border-radius:4px}
  .sys-note{align-self:center;font-size:10.5px;color:var(--text-3);background:var(--surface);
    border:1px dashed var(--line-strong);border-radius:20px;padding:3px 11px}
  .tstep{align-self:flex-start;width:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
  .tstep-head{display:flex;align-items:center;gap:7px;padding:6px 10px;background:var(--surface-2);
    font-size:11px;font-family:var(--mono);color:var(--text-2);border-bottom:1px solid var(--line)}
  .tstep-head .ok2{color:#0d9488;font-weight:700}
  .tstep-head .spin{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line-strong);
    border-top-color:var(--primary);animation:spin 1s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tstep-head .ms{margin-left:auto;font-size:10px;color:var(--text-3)}
  .tstep-body{padding:8px 11px;font-family:var(--mono);font-size:11px;line-height:1.7;color:#4b5567;white-space:pre-wrap}
  .inbox{border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:8px 11px}
  .inbox .ph{font-size:11.5px;color:var(--text-3)}
  .inbox-foot{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:10.5px;color:var(--text-3)}
  .send{margin-left:auto;background:var(--primary);color:#fff;border:none;border-radius:6px;
    padding:3px 12px;font-size:11px;font-family:inherit;cursor:pointer}
  .input-dock{flex-shrink:0;border-top:1px solid var(--line);padding:10px;background:var(--surface-2)}
  .quick-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .quick{font-size:10.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);
    background:var(--surface);color:var(--text-2);cursor:pointer}
  .quick:hover{border-color:var(--primary);color:var(--primary)}

  /* 任务模板卡片（AI 主导的对话区顶部） */
  .tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
  .tpl{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 12px;
    cursor:pointer;transition:border-color .16s,box-shadow .16s,transform .16s}
  .tpl:hover{border-color:var(--tpl-color);box-shadow:0 6px 18px color-mix(in srgb,var(--tpl-color) 16%,transparent);transform:translateY(-2px)}
  .tpl-ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb,var(--tpl-color) 13%,#fff);color:var(--tpl-color);font-size:13px;font-weight:800;
    margin-bottom:8px}
  .tpl-name{font-size:12.5px;font-weight:700;margin-bottom:3px}
  .tpl-desc{font-size:10.5px;color:var(--text-3);line-height:1.5}
  .tpl-agent{margin-top:7px;font-size:10px;color:var(--tpl-color);opacity:.9}
  /* 小空间：卡片退化为按钮 */
  .tpl-btns{display:flex;flex-wrap:wrap;gap:6px}
  .tpl-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 9px;border-radius:7px;
    border:1px solid var(--line);background:var(--surface);color:var(--text-2);cursor:pointer;font-family:inherit}
  .tpl-btn:hover{border-color:var(--tpl-color);color:var(--tpl-color)}

  /* ===================== 办公模式 ===================== */
  .welcome{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .cw-greet{text-align:center;padding:20px 16px 2px;flex-shrink:0}
  .cw-greet h2{font-size:22px;font-weight:700;margin-bottom:5px}
  .cw-greet p{font-size:12.5px;color:var(--text-2)}
  .stage-wrap{flex:1;min-height:170px;position:relative;perspective:1200px;perspective-origin:50% 44%;
    display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:pan-y;overflow:hidden}
  .stage-wrap.dragging{cursor:grabbing}
  .stage{position:relative;width:0;height:0;transform-style:preserve-3d}
  .card{position:absolute;left:-100px;top:-68px;width:200px;height:136px;border-radius:13px;
    border:1px solid var(--line);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:7px;
    box-shadow:0 6px 18px rgba(24,28,45,.08);will-change:transform,opacity;backface-visibility:hidden}
  .card.is-front{border-color:var(--card-color);
    box-shadow:0 12px 30px color-mix(in srgb,var(--card-color) 22%,transparent)}
  .card.is-active{border-color:var(--card-color);
    box-shadow:0 0 0 2px color-mix(in srgb,var(--card-color) 35%,transparent),0 12px 30px color-mix(in srgb,var(--card-color) 20%,transparent)}
  .card-head{display:flex;align-items:center;gap:8px}
  .card-ico{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb,var(--card-color) 13%,#fff);color:var(--card-color);font-size:12px;font-weight:800}
  .card-label{font-size:13px;font-weight:700;flex:1}
  .card-check{color:var(--card-color);font-size:12px}
  .card-desc{font-size:11px;color:var(--text-2);line-height:1.5}
  .card-agent{margin-top:auto;font-size:10.5px;color:var(--card-color);opacity:.9}
  .stage-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-3);
    display:flex;align-items:center;gap:8px;background:color-mix(in srgb,#fff 84%,transparent);padding:4px 11px;
    border-radius:20px;border:1px solid var(--line);backdrop-filter:blur(6px);pointer-events:none;white-space:nowrap}
  .stage-hint kbd{font-family:var(--font);font-size:10px;background:var(--surface-2);border:1px solid var(--line-strong);
    border-radius:4px;padding:0 4px;color:var(--text-2)}
  .ex-row{flex-shrink:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 16px 8px;min-height:28px}
  .ex-btn{font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surface);
    color:var(--text-2);font-family:inherit;cursor:pointer;transition:border-color .15s,color .15s}
  .ex-btn:hover{border-color:var(--scene-color,var(--primary));color:var(--scene-color,var(--primary))}
  .office-msgs{flex-shrink:0;max-height:30%;overflow-y:auto;margin:0 18px 8px;padding:10px 12px;
    border:1px solid var(--line);border-radius:10px;background:var(--surface);
    display:flex;flex-direction:column;gap:8px}
  .office-msgs-head{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;font-weight:700;
    letter-spacing:.05em;color:var(--text-3);position:sticky;top:0;background:var(--surface);padding-bottom:4px}

  /* ===================== 编辑器 ===================== */
  .code{display:flex;font-family:var(--mono);font-size:11.5px;line-height:1.85;border:1px solid var(--line);
    border-radius:9px;overflow:hidden;background:var(--surface)}
  .gutter{flex-shrink:0;padding:10px 8px;text-align:right;color:var(--text-3);background:var(--surface-2);
    border-right:1px solid var(--line);font-size:11px;user-select:none}
  .code pre{flex:1;padding:10px 12px;overflow-x:auto;color:#374151;white-space:pre;margin:0}
  .k{color:#7c3aed}.s{color:#0d9488}.c2{color:#98a2b3}.f{color:#2563eb}.t2{color:#db2777}
  .statusbar{height:24px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 10px;
    background:var(--surface);border-top:1px solid var(--line);font-size:10.5px;color:var(--text-2)}
  .statusbar .sb-r{margin-left:auto;display:flex;gap:12px}
  .outline{border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden;margin-top:10px}
  .outline-head{height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:10.5px;
    font-weight:700;letter-spacing:.05em;color:var(--text-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
  .outline-body{padding:4px}
  .orow{display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:11.5px;font-family:var(--mono);
    color:var(--text-2);border-radius:5px}
  .orow:hover{background:var(--surface-2)}
  .orow .ol{color:var(--text-3);width:22px;text-align:right;font-size:10.5px}
  .orow .ot{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .orow .oc{font-size:9.5px;color:#0d9488;background:#f0fdf9;padding:1px 5px;border-radius:20px;flex-shrink:0}
  .gitbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .gpill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);
    padding:4px 9px;border-radius:7px;background:var(--surface);border:1px solid var(--line);color:var(--text-2)}
  .gpill.add{color:#0d9488;border-color:#cdf3e8;background:#f6fefb}
  .gpill.mod{color:#b45309;border-color:#fde9c2;background:#fffbeb}
  .wtab{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:6px;flex-shrink:0;
    font-size:11.5px;color:var(--text-2);cursor:pointer;border:1px solid transparent;white-space:nowrap}
  .wtab:hover{background:var(--surface-2)}
  .wtab.active{background:var(--surface-2);border-color:var(--line);color:var(--text);font-weight:600}
  .wtab .x{font-size:10px;color:var(--text-3)}
  .wtab .dot-dirty{width:6px;height:6px;border-radius:50%;background:var(--primary)}

  /* ===================== 运维/安全：终端 ===================== */
  .term{background:#0d1320;border-radius:9px;padding:12px 14px;font-family:var(--mono);font-size:11.5px;
    color:#c9d4e8;line-height:1.8;border:1px solid #1a2336;min-height:100%}
  .term .p{color:#4ade80}.term .c{color:#8ea3c8}.term .e{color:#f87171}.term .w{color:#fbbf24}
  .term .dim{color:#5d6d8c}.term .cur{opacity:.45}
  .panelbox{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;margin-bottom:9px}
  .panelbox-head{height:24px;display:flex;align-items:center;gap:6px;padding:0 9px;font-size:10.5px;font-weight:700;
    letter-spacing:.05em;color:var(--text-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
  .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:9px}
  .metric{display:flex;flex-direction:column;gap:3px}
  .metric .ml{font-size:10px;color:var(--text-3)}
  .metric .mv{font-size:13px;font-weight:700;font-family:var(--mono)}
  .bar{height:4px;border-radius:2px;background:var(--line)}
  .bar i{display:block;height:100%;border-radius:2px;background:#0d9488}
  .bar i.warn{background:#f59e0b}
  .proc{font-family:var(--mono);font-size:10.5px;color:var(--text-2)}
  .proc-row{display:flex;gap:8px;padding:3px 9px}
  .proc-row .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proc-row .pc{color:var(--text-3);flex-shrink:0}

/* ============================================================
   3D 轮播（手动拖动 · 惯性吸附 · 无限循环 · 不自动播放）
   ============================================================ */
let carousel = null;
const cardSel = { value: '' };

function initCarousel(){
  const wrap = document.getElementById('stageWrap');
  const stage = document.getElementById('stage');
  if (!wrap || !stage) return;
  const cards = Array.from(stage.querySelectorAll('.card'));
  const N = cards.length;
  const THETA = 360 / N;
  const R = (200 / 2) / Math.tan(Math.PI / N) * 1.38;
  const st = { angle:0, dragging:false, startX:0, startAngle:0, moved:0,
    lastX:0, lastT:0, vel:0, raf:0, snapping:false, downIdx:-1 };

  const frontIndex = () => ((Math.round(-st.angle / THETA) % N) + N) % N;
  function apply(){
    stage.style.transform = 'rotateY(' + st.angle + 'deg)';
    const front = frontIndex();
    cards.forEach((c, i) => {
      let rel = ((i * THETA + st.angle) % 360 + 360) % 360;
      if (rel > 180) rel -= 360;
      const abs = Math.abs(rel), t = Math.min(abs / 180, 1);
      c.style.opacity = String(1 - t * 0.7);
      c.style.transform = 'rotateY(' + (i * THETA) + 'deg) translateZ(' + R + 'px) scale(' + (1 - t * 0.2) + ')';
      c.style.zIndex = String(1000 - Math.round(abs));
      c.style.pointerEvents = abs < 92 ? 'auto' : 'none';
      c.style.filter = abs > 92 ? 'saturate(.55)' : 'none';
      c.classList.toggle('is-front', i === front);
    });
  }
  function snapTo(k, dur){
    st.snapping = true;
    const from = st.angle, to = -k * THETA, t0 = performance.now();
    (function step(now){
      const p = Math.min((now - t0) / dur, 1);
      st.angle = from + (to - from) * (1 - Math.pow(1 - p, 3));
      apply();
      if (p < 1) requestAnimationFrame(step);
      else { st.angle = to; apply(); st.snapping = false; }
    })(t0);
  }
  function inertia(){
    if (Math.abs(st.vel) < 0.02) { snapTo(frontIndex(), 260); return; }
    st.angle += st.vel; st.vel *= 0.94; apply();
    st.raf = requestAnimationFrame(inertia);
  }
  function pickCard(i){
    const s = SCENES[i];
    if (!s) return;
    cardSel.value = (cardSel.value === s.key) ? '' : s.key;
    apply(); updateExRow();
  }
  wrap.addEventListener('pointerdown', (e) => {
    st.snapping = false; cancelAnimationFrame(st.raf);
    st.dragging = true; st.moved = 0;
    st.startX = e.clientX; st.startAngle = st.angle;
    st.lastX = e.clientX; st.lastT = performance.now(); st.vel = 0;
    const el = e.target.closest('.card');
    st.downIdx = el ? Number(el.dataset.idx) : -1;
    wrap.classList.add('dragging');
    if (wrap.setPointerCapture) wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!st.dragging) return;
    const dx = e.clientX - st.startX;
    st.moved = Math.abs(dx);
    st.angle = st.startAngle + dx * 0.22;
    const now = performance.now(), dt = now - st.lastT;
    if (dt > 0) st.vel = ((e.clientX - st.lastX) * 0.22) * (16 / dt);
    st.lastX = e.clientX; st.lastT = now;
    apply();
  });
  function endDrag(e){
    if (!st.dragging) return;
    st.dragging = false; wrap.classList.remove('dragging');
    try { if (wrap.releasePointerCapture) wrap.releasePointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    if (st.moved > 6) inertia();
    else if (st.downIdx >= 0) pickCard(st.downIdx);
    st.downIdx = -1;
  }
  wrap.addEventListener('pointerup', endDrag);
  wrap.addEventListener('pointercancel', endDrag);
  wrap.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft')  { snapTo(frontIndex() + 1, 300); e.preventDefault(); }
    if (e.key === 'ArrowRight') { snapTo(frontIndex() - 1, 300); e.preventDefault(); }
    if (e.key === 'Enter' || e.key === ' ') { pickCard(frontIndex()); e.preventDefault(); }
  });
  apply();
  carousel = { apply };
}
function updateExRow(){
  const row = document.getElementById('exRow');
  if (!row) return;
  const s = SCENES.find((x) => x.key === cardSel.value);
  if (!s) { row.innerHTML = ''; return; }
  row.style.setProperty('--scene-color', s.color);
  row.innerHTML = (EXAMPLES[s.key] || []).map((t) => '<button class="ex-btn">' + t + '</button>').join('');
  document.querySelectorAll('[data-check]').forEach((el) => {
    el.style.visibility = el.dataset.check === s.key ? 'visible' : 'hidden';
  });
}

/* ============================================================
   事件
   ============================================================ */
document.addEventListener('click', (e) => {
  const lb = e.target.closest('[data-lead]');
  if (lb) {
    const lead = lb.dataset.lead;
    if (lead !== LEAD[activeMode]) setLead(activeMode, lead);
    return;
  }
  const sh = e.target.closest('[data-strip-toggle]');
  if (sh) {
    const strip = sh.closest('[data-strip]');
    const body = strip.querySelector('.strip-body');
    const caret = strip.querySelector('.strip-caret');
    const collapsed = strip.classList.toggle('collapsed');
    body.style.display = collapsed ? 'none' : '';
    caret.textContent = collapsed ? '▸' : '';
    return;
  }
  const sw = document.getElementById('modeSwitch');
  const menu = document.getElementById('msMenu');
  if (sw && sw.contains(e.target) && !e.target.closest('.ms-item')) {
    menu.classList.toggle('open');
    return;
  }
  const item = e.target.closest('.ms-item');
  if (item) {
    const k = item.dataset.mode;
    menu.classList.remove('open');
    if (k !== activeMode) setMode(k);
    return;
  }
  if (menu) menu.classList.remove('open');
});

renderSwitcher();
setMode('office');
</script>
