<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>言智 · 四模式布局原型</title>
<style>
  :root{
    /* 新默认配色：中性冷灰 + 靛蓝（原朱砂橙红 #C2410C 已废弃） */
    --primary:#4F46E5; --primary-weak:#EEF0FE;
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#F4F6F9;
    --line:#E7EAF0; --line-strong:#D6DAE3;
    --text:#1C2129; --text-2:#5A6272; --text-3:#8D95A6;
    --office:#4F46E5; --dev:#7C3AED; --ops:#0D9488; --sec:#E11D48;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
    --mono:"JetBrains Mono","SF Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);overflow:hidden}
  .app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* ============ 全局顶栏 ============ */
  .topbar{height:38px;flex-shrink:0;display:flex;align-items:center;background:var(--surface);
    border-bottom:1px solid var(--line);user-select:none}
  .brand{display:flex;align-items:center;gap:7px;padding:0 12px 0 14px}
  .brand-logo{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-size:11px;font-weight:800}
  .brand-name{font-size:13px;font-weight:700}
  .nav{display:flex;align-items:center;gap:1px}
  .nav-item{display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:none;background:transparent;
    border-radius:7px;font-size:12.5px;font-family:inherit;color:var(--text-2);cursor:pointer}
  .nav-item:hover{background:var(--surface-2);color:var(--text)}
  .spacer{flex:1}
  .avatar{width:24px;height:24px;border-radius:50%;background:var(--primary-weak);color:var(--primary);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .win-controls{display:flex}
  .win-btn{width:42px;height:38px;border:none;background:transparent;color:var(--text-2);cursor:pointer;font-size:12px}
  .win-btn:hover{background:#eef0f5}
  .win-btn.close:hover{background:#e81123;color:#fff}

  /* 模式下拉 = 原「任务」导航项原地升级 */
  .mode-switch{position:relative;display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;
    border:none;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;
    background:color-mix(in srgb,var(--mode-color) 11%,transparent);color:var(--mode-color)}
  .mode-switch:hover{background:color-mix(in srgb,var(--mode-color) 18%,transparent)}
  .mode-switch .ms-dot{width:15px;height:15px;border-radius:4px;display:flex;align-items:center;justify-content:center;
    background:var(--mode-color);color:#fff;font-size:9px;font-weight:800}
  .mode-switch .ms-caret{font-size:8px;opacity:.7}
  .ms-menu{position:absolute;top:32px;left:0;width:266px;z-index:900;display:none;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(20,24,40,.14);padding:5px}
  .ms-menu.open{display:block}
  .ms-item{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer}
  .ms-item:hover{background:var(--surface-2)}
  .ms-item.active{background:var(--primary-weak)}
  .ms-ico{width:22px;height:22px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:10px;font-weight:800}
  .ms-name{font-size:12.5px;font-weight:600;display:block}
  .ms-desc{font-size:11px;color:var(--text-3);display:block;margin-top:1px}
  .ms-check{color:var(--primary);font-size:12px}

  /* ============ 模式顶栏 ============ */
  .mode-bar{height:36px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px;
    background:var(--surface);border-bottom:1px solid var(--line)}
  .badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:20px;
    background:color-mix(in srgb,var(--mode-color) 10%,#fff);color:var(--mode-color);
    font-size:11.5px;font-weight:600;border:1px solid color-mix(in srgb,var(--mode-color) 24%,#fff)}
  .badge-dot{width:6px;height:6px;border-radius:50%;background:var(--mode-color)}
  .bar-sep{width:1px;height:16px;background:var(--line)}
  .bar-spacer{flex:1}
  .bar-btn{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border:1px solid var(--line);
    background:var(--surface);border-radius:7px;font-size:11.5px;font-family:inherit;color:var(--text-2);cursor:pointer}
  .bar-btn:hover{border-color:var(--mode-color);color:var(--mode-color)}
  .bar-btn b{font-weight:700;color:var(--text)}
  .iconbtn{width:26px;height:26px;border:1px solid var(--line);background:var(--surface);border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);font-size:12px}
  .iconbtn:hover{border-color:var(--primary);color:var(--primary)}

  /* ============ 三栏骨架 ============ */
  .shell{flex:1;display:flex;min-height:0;overflow:hidden}
  .col{display:flex;flex-direction:column;min-height:0;min-width:0}
  .handle{width:5px;flex-shrink:0;cursor:col-resize}
  .handle:hover{background:color-mix(in srgb,var(--primary) 20%,transparent)}
  .aside{width:244px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line)}
  .aside-head{height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--text-3);
    border-bottom:1px solid var(--line)}
  .aside-head .ah-act{color:var(--text-3);cursor:pointer;font-size:15px;line-height:1}
  .aside-body{flex:1;overflow-y:auto;padding:6px 6px 14px;min-height:0}

  /* 左栏项 */
  .grp{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;
    font-size:11.5px;font-weight:600;color:var(--text-2);margin-top:2px}
  .grp:hover{background:var(--surface-2)}
  .grp .g-caret{font-size:9px;color:var(--text-3);width:9px}
  .grp .g-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grp .g-count{font-size:10px;font-weight:500;color:var(--text-3)}
  .conv{display:flex;align-items:center;gap:7px;padding:6px 8px 6px 12px;border-radius:6px;cursor:pointer;
    font-size:12px;color:var(--text-2)}
  .conv:hover{background:var(--surface-2)}
  .conv.active{background:var(--primary-weak);color:var(--primary);font-weight:600}
  .conv-dot{width:5px;height:5px;border-radius:50%;background:var(--line-strong);flex-shrink:0}
  .conv.active .conv-dot{background:var(--primary)}
  .conv-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-time{font-size:10px;color:var(--text-3);flex-shrink:0}
  .divider{height:1px;background:var(--line);margin:8px 6px}
  .frow{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:6px;cursor:pointer;
    font-size:12px;color:var(--text-2);white-space:nowrap}
  .frow:hover{background:var(--surface-2)}
  .frow.active{background:var(--primary-weak);color:var(--primary);font-weight:600}
  .frow .fi{width:14px;flex-shrink:0;text-align:center;font-size:10.5px;color:var(--text-3)}
  .frow .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .dot.ssh{background:#0ea5e9}.dot.docker{background:#2563eb}.dot.db{background:#f59e0b}
  .tag{font-size:9.5px;padding:1px 5px;border-radius:20px;flex-shrink:0}
  .tag.prod{background:#fff1f2;color:#e11d48;border:1px solid #ffd9de}
  .tag.ok{background:#ecfdf5;color:#0d9488;border:1px solid #cdf3e8}
  .tag.exp{background:#f1f3f7;color:#8d95a6;border:1px solid #e3e7ee}

  /* ============ 中栏 ============ */
  .center{flex:1;background:var(--bg)}
  .center-head{height:34px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 8px;
    border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto}
  .center-body{flex:1;overflow:auto;padding:12px;min-height:0}
  .wtab{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:6px;flex-shrink:0;
    font-size:11.5px;color:var(--text-2);cursor:pointer;border:1px solid transparent;white-space:nowrap}
  .wtab:hover{background:var(--surface-2)}
  .wtab.active{background:var(--surface-2);border-color:var(--line);color:var(--text);font-weight:600}
  .wtab .x{font-size:10px;color:var(--text-3)}
  .wtab .dirty{width:6px;height:6px;border-radius:50%;background:var(--primary)}

  /* ============ 办公欢迎（ChatMessageList 空态，对齐 ChatWelcome.vue） ============ */
  .welcome{padding:26px 20px 12px;display:flex;flex-direction:column;align-items:center;gap:20px;
    flex:1;min-height:0;overflow-y:auto}
  .cw-greeting{text-align:center}
  .cw-avatar{width:46px;height:46px;border-radius:14px;margin:0 auto 10px;display:flex;align-items:center;
    justify-content:center;background:var(--primary-weak);color:var(--primary);font-size:22px}
  .cw-title{font-size:20px;font-weight:700;margin-bottom:6px}
  .cw-sub{font-size:12.5px;color:var(--text-2)}
  /* ===== 3D 循环轮播（决策 2）：手动拖动 · 惯性吸附 · 无限循环 · 不自动播放 ===== */
  .stage-wrap{position:relative;width:100%;max-width:820px;height:236px;flex-shrink:0;
    perspective:1200px;perspective-origin:50% 46%;
    display:flex;align-items:center;justify-content:center;
    cursor:grab;touch-action:pan-y;user-select:none;overflow:hidden}
  .stage-wrap.dragging{cursor:grabbing}
  .stage-wrap:focus-visible{outline:2px solid var(--primary);outline-offset:4px;border-radius:12px}
  .stage{position:relative;width:0;height:0;transform-style:preserve-3d}
  .stage .cw-card{position:absolute;left:-100px;top:-72px;width:200px;height:144px;
    padding:13px 13px 11px;border-radius:13px;
    will-change:transform,opacity;backface-visibility:hidden;
    transition:none;pointer-events:none;overflow:hidden}
  .stage .cw-card .cw-card-desc{font-size:11.5px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .stage .cw-card .cw-card-agent{font-size:10.5px}
  .stage .cw-card.is-front{pointer-events:auto}
  .stage-hint{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--text-3);
    background:color-mix(in srgb,#fff 84%,transparent);border:1px solid var(--line);
    padding:3px 10px;border-radius:20px;backdrop-filter:blur(6px);pointer-events:none;white-space:nowrap}
  .stage-hint kbd{font-family:var(--font);font-size:10px;background:var(--surface-2);
    border:1px solid var(--line-strong);border-radius:4px;padding:0 4px;color:var(--text-2)}
  .ex-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:26px;
    padding:2px 4px 8px;width:100%;max-width:820px}
  .ex-row:empty{min-height:0;padding:0}
  .ex-btn{font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
    background:var(--surface);color:var(--text-2);font-family:inherit;cursor:pointer;
    transition:border-color .15s,color .15s}
  .ex-btn:hover{border-color:var(--scene-color,var(--primary));color:var(--scene-color,var(--primary))}

  /* 窄宽 / 减少动效时降级为横向滑动列表 */
  .flat-wrap{display:none;gap:12px;width:100%;max-width:820px;overflow-x:auto;overflow-y:hidden;
    padding:4px 2px 10px;scroll-snap-type:x mandatory}
  .flat-wrap .cw-card{flex:0 0 192px;scroll-snap-align:center}

  .cw-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:760px}
  .cw-card{position:relative;padding:16px 14px;border-radius:14px;border:1px solid var(--line);
    background:var(--surface);cursor:pointer;text-align:left;
    transition:border-color .18s,box-shadow .18s,transform .18s}
  .cw-card:hover{border-color:var(--scene-color);
    box-shadow:0 6px 18px color-mix(in srgb,var(--scene-color) 16%,transparent);transform:translateY(-2px)}
  .cw-card.is-active{border-color:var(--scene-color);
    box-shadow:0 6px 18px color-mix(in srgb,var(--scene-color) 20%,transparent)}
  .cw-card-head{display:flex;align-items:center;gap:10px}
  .cw-card-icon{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;
    justify-content:center;color:var(--scene-color);font-size:16px;font-weight:800;
    background:color-mix(in srgb,var(--scene-color) 12%,transparent)}
  .cw-card-label{flex:1;font-size:14px;font-weight:600}
  .cw-card-check{color:var(--scene-color);font-size:12px}
  .cw-card-desc{margin-top:8px;font-size:12px;color:var(--text-2);line-height:1.5}
  .cw-card-agent{margin-top:6px;display:flex;align-items:center;gap:4px;font-size:11px;
    color:var(--scene-color);opacity:.85}
  .cw-examples{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
    display:flex;flex-direction:column;gap:6px}
  .cw-example{all:unset;cursor:pointer;font-size:12px;line-height:1.5;color:var(--text-2);
    padding:4px 8px;border-radius:8px;transition:background .15s,color .15s}
  .cw-example:hover{background:color-mix(in srgb,var(--scene-color) 10%,transparent);color:var(--scene-color)}

  /* ============ 对话消息 ============ */
  .chatcol{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
  .msg{max-width:92%;font-size:12.5px;line-height:1.68;padding:9px 12px;border-radius:var(--r-md);white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:3px}
  .msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
  .tstep{align-self:flex-start;width:100%;border:1px solid var(--line);border-radius:var(--r-md);
    background:var(--surface);overflow:hidden}
  .tstep-head{display:flex;align-items:center;gap:7px;padding:6px 10px;background:var(--surface-2);
    font-size:11px;font-family:var(--mono);color:var(--text-2);border-bottom:1px solid var(--line)}
  .tstep-head .ok2{color:#0d9488;font-weight:700}
  .tstep-head .spin{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line-strong);
    border-top-color:var(--primary);animation:spin 1s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tstep-head .ms{margin-left:auto;font-size:10px;color:var(--text-3)}
  .tstep-body{padding:8px 11px;font-family:var(--mono);font-size:11px;line-height:1.7;color:#4b5567;white-space:pre-wrap}
  .inbox{border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);padding:9px 12px}
  .inbox .ph{font-size:12px;color:var(--text-3)}
  .inbox-foot{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:10.5px;color:var(--text-3)}
  .send{margin-left:auto;background:var(--primary);color:#fff;border:none;border-radius:var(--r-sm);
    padding:3px 12px;font-size:11px;font-family:inherit;cursor:pointer}
  .input-dock{flex-shrink:0;border-top:1px solid var(--line);padding:10px;background:var(--bg)}

  /* ============ 编辑器 ============ */
  .code{display:flex;font-family:var(--mono);font-size:11.5px;line-height:1.85;border:1px solid var(--line);
    border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
  .gutter{flex-shrink:0;padding:10px 8px;text-align:right;color:var(--text-3);background:var(--surface-2);
    border-right:1px solid var(--line);font-size:11px;user-select:none}
  .code pre{flex:1;padding:10px 12px;overflow-x:auto;color:#374151;white-space:pre;margin:0}
  .k{color:#7c3aed}.s{color:#0d9488}.c2{color:#98a2b3}.f{color:#2563eb}.t2{color:#db2777}
  .statusbar{height:24px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 10px;
    background:var(--surface);border-top:1px solid var(--line);font-size:10.5px;color:var(--text-2)}
  .statusbar .sb-r{margin-left:auto;display:flex;gap:12px}
  .gitbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .gpill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);
    padding:4px 9px;border-radius:7px;background:var(--surface);border:1px solid var(--line);color:var(--text-2)}
  .gpill.add{color:#0d9488;border-color:#cdf3e8;background:#f6fefb}
  .gpill.mod{color:#b45309;border-color:#fde9c2;background:#fffbeb}
  .outline{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden;margin-top:10px}
  .outline-head{height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:10.5px;
    font-weight:700;letter-spacing:.04em;color:var(--text-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
  .orow{display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:11.5px;font-family:var(--mono);
    color:var(--text-2);border-radius:5px}
  .orow:hover{background:var(--surface-2)}
  .orow .ol{color:var(--text-3);width:22px;text-align:right;font-size:10.5px}
  .orow .ot{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .orow .oc{font-size:9.5px;color:#0d9488;background:#f0fdf9;padding:1px 5px;border-radius:20px}

  /* 代码活动条（CodeSidebar.csb-bar）—— 仅编辑模式 */
  .csb{display:flex;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line)}
  .csb-bar{width:44px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 0;background:var(--surface-2);border-right:1px solid var(--line)}
  .csb-act{width:34px;height:34px;border:none;background:transparent;border-radius:7px;cursor:pointer;
    color:var(--text-3);font-size:15px;display:flex;align-items:center;justify-content:center}
  .csb-act:hover{background:var(--surface);color:var(--text)}
  .csb-act.on{background:var(--surface);color:var(--primary)}
  .csb-spacer{flex:1}

  /* ============ 终端 / 运维 ============ */
  .term{background:#0d1117;border-radius:var(--r-md);padding:12px 14px;font-family:var(--mono);font-size:11.5px;
    color:#c9d4e8;line-height:1.8;min-height:100%;height:100%;overflow:auto}
  .term .p{color:#4ade80}.term .c{color:#8ea3c8}.term .e{color:#f87171}.term .w{color:#fbbf24}
  .term .dim{color:#5d6d8c}.term .cur{opacity:.45}
  .panelbox{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;margin-bottom:9px}
  .panelbox-head{height:24px;display:flex;align-items:center;gap:6px;padding:0 9px;font-size:10.5px;font-weight:700;
    letter-spacing:.04em;color:var(--text-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
  .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:9px}
  .metric{display:flex;flex-direction:column;gap:3px}
  .metric .ml{font-size:10px;color:var(--text-3)}
  .metric .mv{font-size:13px;font-weight:700;font-family:var(--mono)}
  .bar{height:4px;border-radius:2px;background:var(--line)}
  .bar i{display:block;height:100%;border-radius:2px;background:#0d9488}
  .bar i.warn{background:#f59e0b}
  .proc{font-family:var(--mono);font-size:10.5px;color:var(--text-2)}
  .proc-row{display:flex;gap:8px;padding:3px 9px}
  .proc-row .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proc-row .pc{color:var(--text-3);flex-shrink:0}

  /* 文件管理双栏（支持相互拖动） */
  .filecol{width:304px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--line)}
  .fm-body{flex:1;overflow-y:auto;padding:8px;min-height:0}

// 卡片网格（办公与代码共用同一套 cw-* 结构）
function cardGrid(items, activeKey, opts){
  var o = opts || {};
  var N = items.length;
  var THETA = 360 / N;
  var R = (200 / 2) / Math.tan(Math.PI / N) * 1.42;   // 半径：随张数自适应，保证不重叠
  var cards = items.map(function (s, i) {
    var active = (activeKey === s.key);
    var pos = o.carousel
      ? ' style="--scene-color:' + s.color + ';transform:rotateY(' + (i * THETA) + 'deg) translateZ(' + R.toFixed(0) + 'px)"'
      : ' style="--scene-color:' + s.color + '"';
    return '<div class="cw-card' + (active ? ' is-active' : '') + '" data-card="' + s.key + '" data-idx="' + i + '"' + pos + '>' +
      '<div class="cw-card-head">' +
        '<span class="cw-card-icon">' + s.ico + '</span>' +
        '<span class="cw-card-label">' + s.label + '</span>' +
        (active ? '<span class="cw-card-check">✓</span>' : '') +
      '</div>' +
      '<div class="cw-card-desc">' + s.desc + '</div>' +
      '<div class="cw-card-agent">◍ ' + s.agent + '接手</div>' +
      (active && !o.carousel ? '<div class="cw-examples">' +
        s.examples.map(function (e) { return '<button class="cw-example">' + e + '</button>'; }).join('') +
        '</div>' : '') +
      '</div>';
  }).join('');
  // 轮播模式直接返回卡片（不包容器）→ .stage 的直接子元素即卡片，3D 上下文最干净
  return o.carousel ? cards : '<div class="cw-cards">' + cards + '</div>';
}

/* ============================================================

   ============================================================ */
var activeMode = 'office';
var cardSel = { office:'', dev:'' };

function renderSwitcher(){
  var cur = MODES.find(function (m) { return m.key === activeMode; });
  document.getElementById('msDot').textContent = cur.ico;
  document.getElementById('msDot').style.background = cur.color;
  document.getElementById('msName').textContent = cur.name;
  document.getElementById('modeSwitch').style.setProperty('--mode-color', cur.color);
  document.getElementById('msMenu').innerHTML = MODES.map(function (m) {
    return '<div class="ms-item' + (m.key === activeMode ? ' active' : '') + '" data-mode="' + m.key + '">' +
      '<span class="ms-ico" style="background:' + m.color + '">' + m.ico + '</span>' +
      '<span style="flex:1;min-width:0"><span class="ms-name">' + m.name + '</span>' +
      '<span class="ms-desc">' + m.desc + '</span></span>' +
      (m.key === activeMode ? '<span class="ms-check">✓</span>' : '') + '</div>';
  }).join('');
}
function renderCurrent(){
  var root = document.getElementById('modeRoot');
  if (activeMode === 'office') root.innerHTML = renderOffice();
  else if (activeMode === 'dev') root.innerHTML = renderDev();
  else if (activeMode === 'ops') root.innerHTML = renderOps();
  else root.innerHTML = renderSec();
  bindDnd();
  // 只要渲染结果里有轮播容器就初始化（办公 / 代码 AI 模式都用轮播）
  carousel = null;
  if (root.innerHTML.indexOf('stage-wrap') >= 0) initCarousel();
}
function setMode(k){ activeMode = k; renderSwitcher(); renderCurrent(); }
function setLead(mode, lead){ LEAD[mode] = lead; renderCurrent(); }

/* 卡片点选（仅用于「非轮播」卡片：编辑模式右栏的按钮形态）
   轮播容器内的卡片由 initCarousel 的 pickCard 处理，避免重复绑定导致点一下选中两次 */
function bindCards(){
  document.querySelectorAll('[data-card]').forEach(function (el) {
    if (el.closest('.stage-wrap')) return;   // 轮播内的卡片跳过
    el.addEventListener('click', function (e) {
      if (e.target.closest('.cw-example')) return;
      var key = el.dataset.card;
      var cur = cardSel[activeMode] || '';
      cardSel[activeMode] = (cur === key) ? '' : key;
      renderCurrent();
    });
  });
}

/* SFTP 双栏互拖 */
function bindDnd(){
  bindCards();
  var dragItem = null;
  var dragFrom = null;
  document.querySelectorAll('.fm-row[draggable]').forEach(function (row) {
    row.addEventListener('dragstart', function (e) {
      dragItem = row.dataset.file;
      dragFrom = row.closest('.fm-pane').dataset.pane;
      row.classList.add('dragging');
      if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'copy'; e.dataTransfer.setData('text/plain', dragItem); }
    });
    row.addEventListener('dragend', function () {
      row.classList.remove('dragging');
      document.querySelectorAll('.fm-pane').forEach(function (p) { p.classList.remove('dropping'); });
      dragItem = null; dragFrom = null;
    });
  });
  document.querySelectorAll('.fm-pane').forEach(function (pane) {
    pane.addEventListener('dragover', function (e) {
      if (!dragFrom || pane.dataset.pane === dragFrom) return;   // 同栏不响应
      e.preventDefault();
      pane.classList.add('dropping');
      var hint = pane.querySelector('[data-hint]');
      if (hint) hint.textContent = pane.dataset.pane === 'remote' ? '↑ 上传到这里' : '↓ 下载到这里';
    });
    pane.addEventListener('dragleave', function () { pane.classList.remove('dropping'); });
    pane.addEventListener('drop', function (e) {
      e.preventDefault();
      pane.classList.remove('dropping');
      if (!dragFrom || pane.dataset.pane === dragFrom) return;
      var dir = pane.dataset.pane === 'remote' ? '上传' : '下载';
      alert('【原型】' + dir + '：' + dragItem + '\n方向：' + (dragFrom === 'local' ? '本地 → 远程' : '远程 → 本地'));
    });
  });
}

/* ============================================================
   3D 循环轮播：手动拖动 · 惯性吸附 · 无限循环 · 不自动播放（决策 2）
   ============================================================ */
var carousel = null;

function initCarousel(){
  var wrap = document.getElementById('stageWrap');
  var stage = document.getElementById('stage');
  if (!wrap || !stage) return;
  var cards = Array.prototype.slice.call(stage.querySelectorAll('.cw-card'));
  var N = cards.length;
  if (!N) return;
  var THETA = 360 / N;
  var R = (200 / 2) / Math.tan(Math.PI / N) * 1.42;
  var st = { angle:0, dragging:false, startX:0, startAngle:0, moved:0,
             lastX:0, lastT:0, vel:0, raf:0, snapping:false, downIdx:-1 };

  var frontIndex = function () { return ((Math.round(-st.angle / THETA) % N) + N) % N; };

  function apply(){
    stage.style.transform = 'rotateY(' + st.angle + 'deg)';
    var front = frontIndex();
    cards.forEach(function (c, i) {
      var rel = ((i * THETA + st.angle) % 360 + 360) % 360;
      if (rel > 180) rel -= 360;
      var abs = Math.abs(rel);
      var tt = Math.min(abs / 180, 1);
      c.style.opacity = String(1 - tt * 0.72);
      c.style.transform = 'rotateY(' + (i * THETA) + 'deg) translateZ(' + R.toFixed(0) + 'px) scale(' + (1 - tt * 0.18) + ')';
      c.style.zIndex = String(1000 - Math.round(abs));
      c.style.filter = abs > 92 ? 'saturate(.55)' : 'none';
      c.classList.toggle('is-front', i === front);
    });
  }
  function snapTo(k, dur){
    st.snapping = true;
    var from = st.angle, to = -k * THETA, t0 = performance.now();
    (function step(now){
      var p = Math.min((now - t0) / dur, 1);
      st.angle = from + (to - from) * (1 - Math.pow(1 - p, 3));
      apply();
      if (p < 1) requestAnimationFrame(step);
      else { st.angle = to; apply(); st.snapping = false; }
    })(t0);
  }
  function inertia(){
    if (Math.abs(st.vel) < 0.02) { snapTo(frontIndex(), 260); return; }
    st.angle += st.vel; st.vel *= 0.94; apply();
    st.raf = requestAnimationFrame(inertia);
  }
  function pickCard(i){
    var el = cards[i];
    if (!el) return;
    var key = el.dataset.card;
    cardSel[activeMode] = (cardSel[activeMode] === key) ? '' : key;
    renderCurrent();
  }

  wrap.addEventListener('pointerdown', function (e) {
    st.snapping = false; cancelAnimationFrame(st.raf);
    st.dragging = true; st.moved = 0;
    st.startX = e.clientX; st.startAngle = st.angle;
    st.lastX = e.clientX; st.lastT = performance.now(); st.vel = 0;
    var el = e.target.closest('.cw-card');
    st.downIdx = el ? Number(el.dataset.idx) : -1;
    wrap.classList.add('dragging');
    if (wrap.setPointerCapture) wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', function (e) {
    if (!st.dragging) return;
    var dx = e.clientX - st.startX;
    st.moved = Math.abs(dx);
    st.angle = st.startAngle + dx * 0.22;
    var now = performance.now(), dt = now - st.lastT;
    if (dt > 0) st.vel = ((e.clientX - st.lastX) * 0.22) * (16 / dt);
    st.lastX = e.clientX; st.lastT = now;
    apply();
  });
  function endDrag(e){
    if (!st.dragging) return;
    st.dragging = false;
    wrap.classList.remove('dragging');
    try { if (wrap.releasePointerCapture) wrap.releasePointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    if (st.moved > 6) inertia();
    else if (st.downIdx >= 0) pickCard(st.downIdx);
    st.downIdx = -1;
  }
  wrap.addEventListener('pointerup', endDrag);
  wrap.addEventListener('pointercancel', endDrag);
  wrap.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft')  { snapTo(frontIndex() + 1, 300); e.preventDefault(); }
    if (e.key === 'ArrowRight') { snapTo(frontIndex() - 1, 300); e.preventDefault(); }
    if (e.key === 'Enter' || e.key === ' ') { pickCard(frontIndex()); e.preventDefault(); }
  });

  // 降级：窄宽 或 prefers-reduced-motion → 横向滑动列表
  var mqFlat = window.matchMedia('(max-width: 767px)');
  var mqRM = window.matchMedia('(prefers-reduced-motion: reduce)');
  function syncFallback(){
    var flat = mqFlat.matches || mqRM.matches;
    wrap.style.display = flat ? 'none' : 'flex';
    if (!flat) apply();
  }
  if (mqFlat.addEventListener) mqFlat.addEventListener('change', syncFallback);
  if (mqRM.addEventListener) mqRM.addEventListener('change', syncFallback);
  apply();
  syncFallback();
  carousel = { syncFallback: syncFallback };
}

/* ============================================================
   事件
   ============================================================ */
document.addEventListener('click', function (e) {
  var lb = e.target.closest('[data-lead]');
  if (lb) {
    var lead = lb.dataset.lead;
    if (lead !== LEAD[activeMode]) setLead(activeMode, lead);
    return;
  }
  var sw = document.getElementById('modeSwitch');
  var menu = document.getElementById('msMenu');
  if (sw && sw.contains(e.target) && !e.target.closest('.ms-item')) {
    menu.classList.toggle('open'); return;
  }
  var item = e.target.closest('.ms-item');
  if (item) {
    var k = item.dataset.mode;
    menu.classList.remove('open');
    if (k !== activeMode) setMode(k);
    return;
  }
  if (menu) menu.classList.remove('open');
});

renderSwitcher();
setMode('office');
