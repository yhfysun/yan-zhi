schema: spec-driven
created: 2026-09-18
goal: 新增第五种模式「工作流模式」（/workflow），补齐工作流智能体的运行场所与触发方式：人工主导的「运行模式」（选工作流 → 填输入参数与可覆盖节点配置 → 运行并看节点级进度/历史/产物/取消）与 AI 主导的「AI 模式」（新建工作流助手 a_builtin_workflow_assistant，工作流注册为工具供其调用，call_agent 委派为辅）；并打通单节点调试（单节点运行 / 运行到指定节点 / 改中间变量重跑）与定时触发（task_type='workflow' 接线），使工作流智能体从「只能被子智能体挂载」变成一等公民。
