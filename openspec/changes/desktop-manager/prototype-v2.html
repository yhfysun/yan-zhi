<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>桌面整理 · 新版原型</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #10151f; color: #e6ecf8;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 13px; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ---------- 顶栏 ---------- */
  header {
    flex: 0 0 48px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,.07);
    -webkit-app-region: drag; background: #141a26;
  }
  header .t { font-weight: 600; font-size: 14px; }
  header .sum { color: #7d889c; font-size: 12px; }
  header .sp { flex: 1; }
  header button, .tool { -webkit-app-region: no-drag; }
  button {
    border: 0; cursor: pointer; font-family: inherit; font-size: 12.5px;
    padding: 7px 13px; border-radius: 8px; color: #cfd8e8; background: rgba(255,255,255,.08);
    transition: background .15s;
  }
  button:hover { background: rgba(255,255,255,.15); }
  button.primary { background: linear-gradient(135deg,#4f6bff,#7a4dff); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; }
  button.ghost:hover { background: rgba(255,255,255,.08); }

  /* ---------- 主体 ---------- */
  main { flex: 1; display: flex; min-height: 0; }

  /* 左侧分类轨道 */
  aside {
    flex: 0 0 190px; border-right: 1px solid rgba(255,255,255,.06);
    padding: 12px 8px; overflow: auto; background: #121823;
  }
  aside .cap { font-size: 11px; color: #6d788c; padding: 6px 10px 8px; letter-spacing: .5px; }
  .cat {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; color: #b9c5d8; margin-bottom: 2px;
  }
  .cat:hover { background: rgba(255,255,255,.06); }
  .cat.active { background: rgba(91,140,255,.16); color: #dfe8ff; }
  .cat .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .cat .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat .c { font-size: 11px; color: #7d889c; }
  .cat.drop-hint { outline: 1px dashed rgba(122,77,255,.7); background: rgba(122,77,255,.12); }

  /* 右侧内容：分组用「小标题 + 分隔线」，不再一坨一坨的面板 */
  section.stage { flex: 1; overflow: auto; padding: 14px 18px 84px; }
  .group { margin-bottom: 22px; }
  .group-head {
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .group-head .dot { width: 7px; height: 7px; border-radius: 50%; }
  .group-head .name { font-size: 12.5px; color: #aab6c9; font-weight: 600; }
  .group-head .cnt { font-size: 11.5px; color: #6d788c; }
  .group-head .sp { flex: 1; }
  .group-head .mini {
    font-size: 11.5px; color: #8d99ad; background: transparent; padding: 3px 8px;
  }
  .group-head .mini:hover { color: #cfd8e8; background: rgba(255,255,255,.07); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 4px; }
  .item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 4px 8px; border-radius: 10px; cursor: default; user-select: none;
    border: 1px solid transparent;
  }
  .item:hover { background: rgba(255,255,255,.06); }
  .item.sel { background: rgba(91,140,255,.18); border-color: rgba(91,140,255,.45); }
  .item .ico {
    width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
    font-size: 22px; background: rgba(255,255,255,.06);
  }
  .item .nm {
    font-size: 11.5px; line-height: 1.35; text-align: center; color: #c8d3e6;
    max-width: 84px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    word-break: break-all;
  }
  .empty { color: #6d788c; padding: 40px; text-align: center; }

  /* 底部操作条：选中后才出现 */
  .bulk {
    position: fixed; left: 190px; right: 18px; bottom: 14px; height: 52px;
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: rgba(24,31,44,.96); border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
    transform: translateY(80px); opacity: 0; transition: all .18s ease;
  }
  .bulk.show { transform: none; opacity: 1; }
  .bulk .n { color: #9fb4d8; }
  .bulk .sp { flex: 1; }

  /* 确认弹层 */
  .mask {
    position: fixed; inset: 0; background: rgba(6,9,14,.6);
    display: none; place-items: center; z-index: 20;
  }
  .mask.show { display: grid; }
  .dialog {
    width: 380px; background: #171e2b; border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 18px 18px 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .dialog h4 { margin: 0 0 6px; font-size: 14px; }
  .dialog .sub { color: #8d99ad; font-size: 12px; margin-bottom: 12px; }
  .dialog ul { margin: 0 0 16px; padding: 0; list-style: none; }
  .dialog li {
    display: flex; justify-content: space-between; padding: 8px 10px;
    background: rgba(255,255,255,.04); border-radius: 8px; margin-bottom: 6px;
  }
  .dialog li .c { color: #7ef0b0; }
  .dialog .row { display: flex; gap: 8px; justify-content: flex-end; }

  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
    background: rgba(24,31,44,.96); border: 1px solid rgba(255,255,255,.12);
    padding: 9px 16px; border-radius: 10px; color: #cfe0ff; opacity: 0; transition: all .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
  <header>
    <span class="t">桌面整理</span>
    <span class="sum" id="sum">24 个文件 · 13 个待归类</span>
    <span class="sp"></span>
    <button class="primary" id="btnOrganize">一键整理</button>
    <button class="ghost" id="btnRefresh">刷新</button>
    <button class="ghost" id="btnClose">关闭</button>
  </header>

  <main>
    <aside>
      <div class="cap">分类</div>
      <div id="cats"></div>
    </aside>
    <section class="stage" id="stage"></section>
  </main>

  <div class="bulk" id="bulk">
    <span class="n" id="bulkN">已选 0 项</span>
    <span class="sp"></span>
    <button id="btnMove">移入分类 ▾</button>
    <button id="btnNewGroup">新建分类</button>
    <button class="ghost" id="btnClear">取消选择</button>
  </div>

  <div class="mask" id="mask">
    <div class="dialog">
      <h4>确认整理</h4>
      <div class="sub">只移动、不删除；可在围栏里一键撤销。</div>
      <ul id="dlgList"></ul>
      <div class="row">
        <button class="ghost" id="dlgCancel">取消</button>
        <button class="primary" id="dlgOk">开始整理</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const COLORS = ['#5b8cff', '#b07cff', '#37c98b', '#f0a03c', '#2fc6c6', '#ff7a9c', '#9aa6ba'];
const DATA = [
  { g: '图片截图', items: ['截图 2026-10-26 1512.png', '截图 2026-10-25 0944.png', '产品原型-v3.png', '设计稿-首页.png', '海报-banner.webp', '参考-竞品.png', '未命名-1.png', '未命名-2.png', '扫码-20261024.png', '头像素材.png', '头像素材 (2).png', '纹理-01.jpg', '纹理-02.jpg'], ico: '🖼' },
  { g: '文档', items: ['需求说明.docx', '技术方案.pptx', '合同扫描.pdf', '接口文档.pdf', '周报-第04期.docx', '会议纪要.docx', '说明.txt'], ico: '📄' },
  { g: '表格', items: ['报价单-final.xlsx', '预算表.xlsx', '台账.xlsx', '对比.xlsx'], ico: '📊' },
  { g: '安装包', items: ['WeChatSetup.exe'], ico: '📦' },
  { g: '压缩包', items: ['素材包.zip'], ico: '🗜' },
];
const PENDING = { g: '待归类', items: ['旧项目备份', '新建文件夹 (2)', '未命名文档 (3)', 'download'], ico: '📁' };

const state = { cat: 'all', sel: new Set() };
const allGroups = () => [PENDING, ...DATA];
const colorOf = (name) => COLORS[allGroups().findIndex((x) => x.g === name) % COLORS.length];

function render() {
  const sumTotal = allGroups().reduce((n, x) => n + x.items.length, 0);
  document.getElementById('sum').textContent = `${sumTotal} 个文件 · ${PENDING.items.length} 个待归类`;

  document.getElementById('cats').innerHTML = `
    <div class="cat ${state.cat === 'all' ? 'active' : ''}" data-cat="all">
      <span class="dot" style="background:#6d788c"></span><span class="n">全部文件</span><span class="c">${sumTotal}</span>
    </div>` + allGroups().map((x) => `
    <div class="cat ${state.cat === x.g ? 'active' : ''}" data-cat="${x.g}">
      <span class="dot" style="background:${colorOf(x.g)}"></span>
      <span class="n">${x.g}</span><span class="c">${x.items.length}</span>
    </div>`).join('');

  const shown = state.cat === 'all' ? allGroups() : allGroups().filter((x) => x.g === state.cat);
  document.getElementById('stage').innerHTML = shown.map((g) => `
    <div class="group">
      <div class="group-head">
        <span class="dot" style="background:${colorOf(g.g)}"></span>
        <span class="name">${g.g}</span><span class="cnt">${g.items.length}</span>
        <span class="sp"></span>
        ${g.g === '待归类' ? '<button class="mini" data-only="pending">只看待归类</button>' : ''}
      </div>
      <div class="grid">
        ${g.items.map((n) => `
          <div class="item ${state.sel.has(n) ? 'sel' : ''}" data-name="${n}" data-group="${g.g}">
            <span class="ico">${g.ico}</span><span class="nm">${n}</span>
          </div>`).join('')}
      </div>
    </div>`).join('') || '<div class="empty">这个分类还没有文件</div>';

  const n = state.sel.size;
  document.getElementById('bulk').classList.toggle('show', n > 0);
  document.getElementById('bulkN').textContent = `已选 ${n} 项`;
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}

document.addEventListener('click', (e) => {
  const cat = e.target.closest('.cat');
  if (cat) { state.cat = cat.dataset.cat; state.sel.clear(); render(); return; }
  const item = e.target.closest('.item');
  if (item) {
    const n = item.dataset.name;
    state.sel.has(n) ? state.sel.delete(n) : state.sel.add(n);
    render(); return;
  }
});
document.addEventListener('dblclick', (e) => {
  const item = e.target.closest('.item');
  if (item) toast(`打开：${item.dataset.name}（原型演示）`);
});

document.getElementById('btnOrganize').onclick = () => {
  document.getElementById('dlgList').innerHTML = DATA
    .map((g) => `<li><span>${g.g}</span><span class="c">${g.items.length} 个</span></li>`).join('');
  document.getElementById('mask').classList.add('show');
};
document.getElementById('dlgCancel').onclick = () => document.getElementById('mask').classList.remove('show');
document.getElementById('dlgOk').onclick = () => {
  document.getElementById('mask').classList.remove('show');
  toast('已整理 13 个文件 · 可在「更多」里撤销');
};
document.getElementById('btnRefresh').onclick = () => toast('已刷新');
document.getElementById('btnClose').onclick = () => toast('关闭窗口（原型演示）');
document.getElementById('btnClear').onclick = () => { state.sel.clear(); render(); };
document.getElementById('btnMove').onclick = () => toast('移入分类（原型演示）');
document.getElementById('btnNewGroup').onclick = () => toast('新建分类（原型演示）');

render();
</script>
</body>
</html>
