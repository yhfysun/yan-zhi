<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  html,body{margin:0;height:100%;font:14px system-ui;background:#111827;color:#e5e7eb}
  #bar{height:44px;background:#1f2937;display:flex;align-items:center;padding:0 16px;gap:12px;font-size:13px}
  #stage{position:relative;height:calc(100% - 44px)}
  /* webview 作为普通 DOM 节点参与布局（由 renderer.js 动态创建，便于切换 nodeintegration 变体） */
  #slot{position:absolute;left:24px;top:24px;width:640px;height:420px;background:#fff;overflow:hidden}
  #slot webview{width:100%;height:100%;display:block}
  /* ① 验证：DOM 浮层能否盖在 webview 之上 */
  #overlay{position:absolute;left:96px;top:96px;width:400px;height:200px;background:rgba(255,0,64,.94);
           z-index:9999;border-radius:12px;padding:18px;color:#fff;font-weight:700;font-size:22px;
           box-shadow:0 12px 40px rgba(0,0,0,.55)}
  #overlay small{display:block;font-weight:400;font-size:13px;margin-top:10px;opacity:.92}
  #status{position:absolute;left:24px;bottom:6px;right:24px;font-size:12px;opacity:.75;white-space:pre-wrap}
</style></head>
<body>
  <div id="bar"><b>P0 webview 验证</b><span id="hit">hit-test: …</span></div>
  <div id="stage">
    <div id="slot"></div>
    <div id="overlay">OVERLAY 浮层
      <small>若红色块可见地盖在网页之上 = 层级问题解决 ✅（BrowserView 做不到）</small>
    </div>
    <div id="status">running…</div>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
