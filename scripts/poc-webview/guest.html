<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  body{margin:0;height:100vh;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font:16px/1.5 system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  input{width:320px;padding:10px;font-size:16px;border-radius:6px;border:0;color:#111}
  .tag{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:999px}
</style></head>
<body>
  <div class="tag">GUEST PAGE INSIDE WEBVIEW</div>
  <input id="in" placeholder="type here..." />
  <div id="out">value=(empty)</div>
  <script>
    const el = document.getElementById('in');
    el.addEventListener('input', () => { document.getElementById('out').textContent = 'value=' + el.value; });
    el.focus();
  </script>
</body>
</html>
