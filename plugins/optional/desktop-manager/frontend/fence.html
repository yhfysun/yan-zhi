<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>桌面整理</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #fff; user-select: none;
  }

  /* 顶部悬浮工具条：一条细胶囊，不占桌面 */
  .bar {
    position: fixed; left: 18px; top: 14px; z-index: 30;
    display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px;
    background: rgba(18,23,34,.62); border-radius: 999px;
    box-shadow: 0 6px 22px rgba(0,0,0,.28);
    backdrop-filter: blur(10px);
  }
  .bar .t { font-size: 12px; color: #dfe8ff; opacity: .9; margin-right: 4px; }
  .bar .stat { font-size: 11.5px; color: #9fb0c9; margin-right: 6px; }
  .bar button {
    border: 0; cursor: pointer; font-family: inherit; font-size: 12px;
    padding: 5px 11px; border-radius: 999px; color: #cfd8e8; background: rgba(255,255,255,.1);
  }
  .bar button:hover { background: rgba(255,255,255,.2); }
  .bar button.primary { background: linear-gradient(135deg,#4f6bff,#7a4dff); color: #fff; }
  .bar button.ghost { background: transparent; }
  .bar button.ghost:hover { background: rgba(255,255,255,.12); }

  /* 桌面区域：分组自动流式排布，壁纸透出来 */
  #board {
    position: fixed; inset: 58px 18px 18px; z-index: 10;
    display: flex; flex-wrap: wrap; align-content: flex-start; gap: 18px;
    overflow: auto;
  }
  .grp {
    padding: 10px 12px 12px; border-radius: 14px;
    background: rgba(18,23,34,.34);
    box-shadow: 0 8px 26px rgba(0,0,0,.18);
    min-width: 220px;
  }
  .grp.hot { background: rgba(96,124,255,.3); box-shadow: 0 0 0 2px rgba(122,77,255,.65); }
  .grp-head {
    display: flex; align-items: center; gap: 7px; padding: 0 2px 8px;
  }
  .grp-head .dot { width: 7px; height: 7px; border-radius: 50%; }
  .grp-head .n {
    font-size: 12px; color: rgba(255,255,255,.92); font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  .grp-head .c { font-size: 11px; color: rgba(255,255,255,.55); }
  .grp-head .sp { flex: 1; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, 84px); gap: 2px; }
  .ic {
    width: 84px; padding: 7px 2px 6px; border-radius: 9px; cursor: default;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .ic:hover { background: rgba(255,255,255,.14); }
  .ic.sel { background: rgba(122,77,255,.4); }
  .ic .ico {
    width: 48px; height: 48px; display: grid; place-items: center; font-size: 26px;
  }
  .ic .ico img { width: 48px; height: 48px; object-fit: contain; image-rendering: auto; }
  .ic .nm {
    font-size: 11.5px; line-height: 1.3; text-align: center; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.65);
    max-width: 80px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; word-break: break-all;
  }
  .empty {
    color: rgba(255,255,255,.7); text-shadow: 0 1px 3px rgba(0,0,0,.6);
    padding: 60px 20px; font-size: 13px;
  }

  .bulk {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(80px);
    display: flex; align-items: center; gap: 8px; padding: 8px 14px; z-index: 30;
    background: rgba(18,23,34,.85); border-radius: 999px; box-shadow: 0 8px 26px rgba(0,0,0,.35);
    opacity: 0; transition: all .18s ease;
  }
  .bulk.show { transform: translateX(-50%); opacity: 1; }
  .bulk .n { font-size: 12px; color: #cfd8e8; }
  .bulk select {
    background: rgba(255,255,255,.1); color: #e6ecf8; border: 0; border-radius: 999px;
    padding: 6px 10px; font-family: inherit; font-size: 12px; outline: none;
  }
  .bulk button {
    border: 0; cursor: pointer; font-family: inherit; font-size: 12px; padding: 6px 12px;
    border-radius: 999px; color: #cfd8e8; background: rgba(255,255,255,.12);
  }
  .bulk button.ghost { background: transparent; }

  .mask { position: fixed; inset: 0; background: rgba(6,9,14,.5); display: none; place-items: center; z-index: 40; }
  .mask.show { display: grid; }
  .dialog {
    width: 360px; background: #171e2b; border-radius: 14px; padding: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); color: #e6ecf8;
  }
  .dialog h4 { margin: 0 0 6px; font-size: 14px; }
  .dialog .sub { color: #8d99ad; font-size: 12px; margin-bottom: 12px; }
  .dialog ul { margin: 0 0 14px; padding: 0; list-style: none; max-height: 230px; overflow: auto; }
  .dialog li {
    display: flex; justify-content: space-between; padding: 8px 10px;
    background: rgba(255,255,255,.05); border-radius: 8px; margin-bottom: 6px; font-size: 12.5px;
  }
  .dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
  .dialog input {
    width: 100%; padding: 8px 10px; border-radius: 8px; outline: none;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    color: #e6ecf8; font-family: inherit; font-size: 12.5px;
  }
  .dialog button {
    border: 0; cursor: pointer; font-family: inherit; font-size: 12.5px; padding: 7px 14px;
    border-radius: 8px; color: #cfd8e8; background: rgba(255,255,255,.1);
  }
  .dialog button.primary { background: linear-gradient(135deg,#4f6bff,#7a4dff); color: #fff; }

  .toast {
    position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%) translateY(16px);
    background: rgba(18,23,34,.9); color: #cfe0ff; font-size: 12.5px;
    padding: 9px 16px; border-radius: 10px; opacity: 0; transition: all .2s; pointer-events: none;
    max-width: 70vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .toast.err { color: #ff9b9b; }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <span class="t">桌面整理</span>
    <span class="stat" id="stat">加载中…</span>
    <button class="primary" id="btnOrganize">一键整理</button>
    <button id="btnNew">+ 分组</button>
    <button id="btnAddWidget">＋组件</button>
    <button class="ghost" id="btnSettings">设置</button>
    <button class="ghost" id="btnExit">退出</button>
  </div>

  <div id="board"></div>

  <div class="bulk" id="bulk">
    <span class="n" id="bulkN">已选 0 项</span>
    <select id="moveSel"></select>
    <button id="btnMove">移入</button>
    <button class="ghost" id="btnClear">取消</button>
  </div>

  <div class="mask" id="mask">
    <div class="dialog">
      <h4>确认整理</h4>
      <div class="sub" id="dlgSub">只移动、不删除；执行后可整批撤销。</div>
      <ul id="dlgList"></ul>
      <div class="row">
        <button id="dlgCancel">取消</button>
        <button class="primary" id="dlgOk">开始整理</button>
      </div>
    </div>
  </div>

  <div class="mask" id="askMask">
    <div class="dialog" style="width:320px">
      <h4 id="askTitle">新建分组</h4>
      <div class="sub" id="askSub">只改显示分组，不移动任何文件。</div>
      <input id="askInput" type="text" maxlength="24" />
      <div class="row" style="margin-top:12px">
        <button id="askCancel">取消</button>
        <button class="primary" id="askOk">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script type="module" src="./fence.mjs"></script>
</body>
</html>
