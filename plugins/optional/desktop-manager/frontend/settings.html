<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>桌面管理 · 设置</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #141a26; color: #e6ecf8;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 13px; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    flex: 0 0 44px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; -webkit-app-region: drag;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  header .t { font-size: 13px; font-weight: 600; }
  header .sp { flex: 1; }
  header button { -webkit-app-region: no-drag; }
  button {
    border: 0; cursor: pointer; font-family: inherit; font-size: 12.5px;
    padding: 6px 12px; border-radius: 8px; color: #cfd8e8; background: rgba(255,255,255,.09);
  }
  button:hover { background: rgba(255,255,255,.16); }
  button.primary { background: linear-gradient(135deg,#4f6bff,#7a4dff); color: #fff; }
  button.danger { background: rgba(255,90,90,.16); color: #ff9b9b; }

  main { flex: 1; overflow: auto; padding: 14px 16px 24px; }
  section { margin-bottom: 18px; }
  section > h3 { margin: 0 0 10px; font-size: 12.5px; color: #9aa6ba; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .row label { width: 110px; color: #b9c5d8; flex: none; }
  input[type=text], input[type=number], select, textarea {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    color: #e6ecf8; border-radius: 8px; padding: 7px 10px; font-family: inherit; font-size: 12.5px;
    outline: none; width: 100%;
  }
  input:focus, select:focus, textarea:focus { border-color: rgba(110,140,255,.6); }
  textarea { min-height: 74px; resize: vertical; line-height: 1.5; }
  .hint { font-size: 11.5px; color: #7d889c; line-height: 1.6; }

  /* 自绘下拉（默认策略）：暗色主题下不用原生 select 的弹层 */
  .sel { position: relative; flex: 1; min-width: 0; }
  .sel-btn {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px; padding: 7px 10px; color: #e6ecf8;
  }
  .sel-btn:hover { background: rgba(255,255,255,.1); }
  .sel.open .sel-btn { border-color: rgba(110,140,255,.65); background: rgba(255,255,255,.09); }
  .sel-name { font-size: 12.5px; font-weight: 600; color: #eef3ff; flex: none; }
  .sel-desc { flex: 1; min-width: 0; font-size: 11.5px; color: #8d99ad; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sel-caret {
    width: 7px; height: 7px; flex: none; margin-right: 3px;
    border-right: 1.5px solid #9aa6ba; border-bottom: 1.5px solid #9aa6ba;
    transform: rotate(45deg) translate(-2px,-2px); transition: transform .15s ease;
  }
  .sel.open .sel-caret { transform: rotate(-135deg) translate(-1px,-1px); }
  .sel-menu {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20;
    display: none; padding: 5px; border-radius: 10px;
    background: #1b2230; border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 14px 34px rgba(0,0,0,.45);
  }
  .sel.open .sel-menu { display: block; }
  .sel-opt {
    display: flex; align-items: baseline; gap: 9px; padding: 8px 10px;
    border-radius: 7px; cursor: pointer;
  }
  .sel-opt:hover { background: rgba(122,150,255,.16); }
  .sel-opt .t { font-size: 12.5px; color: #e6ecf8; flex: none; }
  .sel-opt .d { font-size: 11.5px; color: #8d99ad; }
  .sel-opt .tick { margin-left: auto; font-size: 12px; color: #7ea0ff; opacity: 0; }
  .sel-opt[aria-selected="true"] { background: rgba(122,150,255,.2); }
  .sel-opt[aria-selected="true"] .t { color: #fff; }
  .sel-opt[aria-selected="true"] .tick { opacity: 1; }
  .list { border: 1px solid rgba(255,255,255,.08); border-radius: 10px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .item:last-child { border-bottom: 0; }
  .item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .item .n { flex: 1; }
  .item .c { font-size: 11.5px; color: #8d99ad; }
  .bar { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .status { font-size: 12px; color: #7ef0b0; }
  .status.err { color: #ff9b9b; }
  .mask { position: fixed; inset: 0; background: rgba(6,9,14,.55); display: none; place-items: center; z-index: 50; }
  .mask.show { display: grid; }
  .dialog { width: 340px; background: #171e2b; border-radius: 14px; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .dialog h4 { margin: 0 0 6px; font-size: 14px; }
  .dialog .sub { color: #8d99ad; font-size: 12px; margin-bottom: 12px; }
  .dialog input { width: 100%; padding: 8px 10px; border-radius: 8px; outline: none; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: #e6ecf8; font-family: inherit; font-size: 12.5px; }
  .dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .item .k { font-size: 11px; color: #7d889c; margin-left: 6px; }
</style>
</head>
<body>
  <header>
    <span class="t">桌面管理 · 设置</span>
    <span class="sp"></span>
    <button id="btnClose">关闭</button>
  </header>
  <main>
    <section>
      <h3>整理</h3>
      <div class="row">
        <label>默认策略</label>
        <!-- 自绘下拉：原生 <select> 的弹出层跟系统主题走，暗色页面上会出现白底浅字看不清 -->
        <div class="sel" id="strategySel">
          <button type="button" class="sel-btn" id="strategyBtn" aria-haspopup="listbox" aria-expanded="false">
            <span class="sel-name" id="strategyName">规则整理</span>
            <span class="sel-desc" id="strategyDesc">纯本地规则，不调用大模型</span>
            <span class="sel-caret"></span>
          </button>
          <div class="sel-menu" id="strategyMenu" role="listbox" aria-label="默认策略"></div>
        </div>
      </div>
      <div class="row">
        <label></label>
        <p class="hint" style="margin:0">AI 整理需要平台里已配置可用的模型；不可用时自动回落规则模式，不会产出半截方案。</p>
      </div>
      <div class="row">
        <label>目标目录前缀</label>
        <input id="targetRoot" type="text" placeholder="留空 = 直接放桌面下，如 文档/ 图片/" />
      </div>
      <div class="row">
        <label>时间簇</label>
        <label style="width:auto;display:flex;gap:6px;align-items:center;">
          <input id="tcEnabled" type="checkbox" style="width:auto" /> 按最近
        </label>
        <input id="tcDays" type="number" min="1" max="60" style="width:80px" />
        <span class="hint">天分组（仅图片/视频）</span>
      </div>
      <div class="row">
        <label>天气城市</label>
        <input id="city" type="text" placeholder="如：成都（Open-Meteo 按城市名查，无需 key）" />
      </div>
      <div class="row">
        <label>下班时间</label>
        <input id="workEnd" type="text" style="width:96px" placeholder="18:00" />
        <span class="hint">没排开始时间的待办，按「下班前 1.5 小时」汇总提醒</span>
      </div>
    </section>

    <section>
      <h3>规则</h3>
      <div class="row" style="align-items:flex-start">
        <label>自定义规则</label>
        <textarea id="rules" placeholder="每行一条：*.pdf => 文档&#10;星图* => 项目·星图&#10;（越靠前优先级越高）"></textarea>
      </div>
      <div class="row" style="align-items:flex-start">
        <label>项目关键词</label>
        <textarea id="projects" placeholder="文件名包含即归入同名围栏，如：星图, 青岚"></textarea>
      </div>
      <div class="row" style="align-items:flex-start">
        <label>保留名单</label>
        <textarea id="keep" placeholder="每行一条 glob，如：*.lnk"></textarea>
      </div>
      <div class="bar">
        <button class="primary" id="btnSave">保存</button>
        <span class="status" id="status"></span>
      </div>
    </section>

    <section>
      <h3>围栏</h3>
      <div class="list" id="fenceList"></div>
      <div class="bar">
        <button id="btnNewFence">+ 新建围栏</button>
        <button id="btnOpenFence">打开围栏（桌面层）</button>
      </div>
      <div class="bar">
        <button id="btnOpenWidgets">打开组件（桌面层）</button>
        <button id="btnOpenWidgetsOverlay">打开组件（悬浮层）</button>
      </div>
      <p class="hint" style="margin-top:10px">
        围栏会隐藏系统桌面图标并自绘；关闭窗口或退出应用时基座会自动恢复图标。
        开机自启围栏需要宿主提供启动任务能力（暂未实现）。
      </p>
    </section>
    <section>
      <h3>组件</h3>
      <div class="list" id="widgetList"></div>
      <div class="bar">
        <button id="btnAddWidget">+ 新建组件</button>
        <span class="hint">右击桌面层工具条/分组也能新建</span>
      </div>
    </section>
  </main>
  <div class="mask" id="askMask">
    <div class="dialog">
      <h4 id="askTitle">新建围栏</h4>
      <div class="sub" id="askSub">只改显示分组，不移动任何文件。</div>
      <input id="askInput" type="text" maxlength="24" />
      <div class="row">
        <button id="askCancel">取消</button>
        <button class="primary" id="askOk">确定</button>
      </div>
    </div>
  </div>

  <script type="module" src="./settings.mjs"></script>
</body>
</html>
