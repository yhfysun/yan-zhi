<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>桌面组件</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: #eef3ff; }
  body.demo {
    background:
      radial-gradient(900px 520px at 18% 12%, rgba(64,130,255,.30), transparent 60%),
      radial-gradient(760px 520px at 82% 24%, rgba(150,84,255,.24), transparent 62%),
      linear-gradient(135deg, #0a1628 0%, #102a4e 46%, #16324f 100%);
  }

  .widget {
    position: absolute; border-radius: 16px; padding: 14px 16px;
    background: rgba(16,22,36,.58); border: 1px solid rgba(255,255,255,.13);
    box-shadow: 0 14px 40px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(16px); overflow: hidden;
  }
  .widget .wt { font-size: 12px; color: rgba(255,255,255,.55); margin-bottom: 8px; letter-spacing: .4px; }

  .clock .hm { font-size: 40px; font-weight: 300; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .clock .dt { font-size: 12px; color: rgba(255,255,255,.62); margin-top: 2px; }

  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12.5px; color: #dfe6f5; }
  .rows li .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rows li .s { font-size: 11px; color: rgba(255,255,255,.45); flex: none; }

  .metric .big { font-size: 32px; font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .metric .cap { font-size: 11.5px; color: rgba(255,255,255,.55); margin-top: 2px; }

  .status .st { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 12.5px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .status .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .pg { font-size: 11px; color: rgba(255,255,255,.45); font-variant-numeric: tabular-nums; }

  .text { display: flex; align-items: center; font-size: 14px; line-height: 1.6; color: #e8eefc; }
  .text.s { font-size: 12px; } .text.l { font-size: 20px; font-weight: 500; }

  .link { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .link .ic { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.10); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .link .lb { font-size: 13px; }
  .link:hover { background: rgba(255,255,255,.06); border-radius: 10px; }

  .empty { font-size: 12px; color: rgba(255,255,255,.4); }

  /* 天气：大温度 + 图标 + 三日预报 */
  .weather .wx-top { display: flex; align-items: center; gap: 12px; }
  .weather .wx-ic { font-size: 32px; line-height: 1; }
  .weather .wx-temp { font-size: 32px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .weather .wx-temp small { font-size: 15px; opacity: .65; margin-left: 2px; }
  .weather .wx-desc { margin-left: auto; text-align: right; font-size: 11.5px; color: rgba(255,255,255,.66); line-height: 1.5; }
  .weather .wx-meta { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: rgba(255,255,255,.5); }
  .weather .wx-days { display: flex; gap: 6px; margin-top: 10px; }
  .weather .wx-day { flex: 1; padding: 6px 6px 5px; border-radius: 10px; background: rgba(255,255,255,.06); text-align: center; }
  .weather .wx-day .d { font-size: 10.5px; color: rgba(255,255,255,.55); }
  .weather .wx-day .i { font-size: 15px; margin: 2px 0; }
  .weather .wx-day .t { font-size: 11px; font-variant-numeric: tabular-nums; }
  .weather .wx-err { font-size: 12px; line-height: 1.5; color: #ffb4b4; }

  /* 待办：勾选 + 开始时间 + 快速添加 */
  .todos .td { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12.5px; }
  .todos .td .cb {
    width: 14px; height: 14px; border-radius: 4px; flex: none; cursor: pointer;
    border: 1.5px solid rgba(255,255,255,.42); display: grid; place-items: center; font-size: 10px;
  }
  .todos .td.done .cb { background: #4f6bff; border-color: #4f6bff; }
  .todos .td .tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .todos .td.done .tx { color: rgba(255,255,255,.38); text-decoration: line-through; }
  .todos .td .tm { flex: none; font-size: 11px; color: #8fb3ff; font-variant-numeric: tabular-nums; }
  .todos .add { display: flex; gap: 6px; margin-top: 8px; }
  .todos .add input {
    flex: 1; min-width: 0; padding: 5px 8px; border-radius: 8px; outline: none;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    color: #eef3ff; font: inherit; font-size: 12px;
  }
  .todos .add button {
    border: 0; cursor: pointer; font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 8px;
    background: linear-gradient(135deg,#4f6bff,#7a4dff); color: #fff;
  }
  /* 备忘录：直接写的便签 */
  .memo .memo-ta {
    flex: 1; width: 100%; min-height: 60px; resize: none;
    background: transparent; border: 0; outline: none; color: #eef3ff;
    font-family: inherit; font-size: 13px; line-height: 1.65;
  }
  .memo .memo-ta.s { font-size: 12px; }
  .memo .memo-ta.l { font-size: 15px; }
  .memo .memo-ta::placeholder { color: rgba(255,255,255,.32); }

  /* 文件夹块 */
  .folder > div, .memo > div { display: flex; flex-direction: column; height: 100%; }
  .folder .fold {
    display: flex; flex-direction: column;
    max-height: calc(100% - 46px); overflow: auto; margin-right: -4px; padding-right: 4px;
  }
  .folder .fr {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px;
    cursor: pointer; font-size: 12.5px; color: #dfe6f5;
  }
  .folder .fr:hover { background: rgba(255,255,255,.09); }
  .folder .fr .ic { font-size: 14px; width: 18px; text-align: center; flex: none; }
  .folder .fr .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .folder .cap { margin-top: 6px; font-size: 11px; color: rgba(255,255,255,.45); }

  /* 提醒的本地兜底（宠物没开时） */
  .flash {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
    max-width: 60vw; padding: 9px 14px; border-radius: 12px;
    background: rgba(18,23,34,.92); border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 10px 28px rgba(0,0,0,.35); color: #e8eeff; font-size: 12.5px; line-height: 1.5;
  }
</style>
</head>
<body>
  <div id="layer"></div>
  <script type="module" src="./widgets.mjs"></script>
</body>
</html>
