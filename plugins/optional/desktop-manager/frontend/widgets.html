<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>桌面组件</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: #eef3ff; }
  body.demo {
    background:
      radial-gradient(900px 520px at 18% 12%, rgba(64,130,255,.30), transparent 60%),
      radial-gradient(760px 520px at 82% 24%, rgba(150,84,255,.24), transparent 62%),
      linear-gradient(135deg, #0a1628 0%, #102a4e 46%, #16324f 100%);
  }

  .widget {
    position: absolute; border-radius: 16px; padding: 14px 16px;
    background: rgba(16,22,36,.58); border: 1px solid rgba(255,255,255,.13);
    box-shadow: 0 14px 40px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(16px); overflow: hidden;
  }
  .widget .wt { font-size: 12px; color: rgba(255,255,255,.55); margin-bottom: 8px; letter-spacing: .4px; }

  .clock .hm { font-size: 40px; font-weight: 300; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .clock .dt { font-size: 12px; color: rgba(255,255,255,.62); margin-top: 2px; }

  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12.5px; color: #dfe6f5; }
  .rows li .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rows li .s { font-size: 11px; color: rgba(255,255,255,.45); flex: none; }

  .metric .big { font-size: 32px; font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .metric .cap { font-size: 11.5px; color: rgba(255,255,255,.55); margin-top: 2px; }

  .status .st { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 12.5px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .status .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .pg { font-size: 11px; color: rgba(255,255,255,.45); font-variant-numeric: tabular-nums; }

  .text { display: flex; align-items: center; font-size: 14px; line-height: 1.6; color: #e8eefc; }
  .text.s { font-size: 12px; } .text.l { font-size: 20px; font-weight: 500; }

  .link { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .link .ic { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.10); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .link .lb { font-size: 13px; }
  .link:hover { background: rgba(255,255,255,.06); border-radius: 10px; }

  .empty { font-size: 12px; color: rgba(255,255,255,.4); }
</style>
</head>
<body>
  <div id="layer"></div>
  <script type="module" src="./widgets.mjs"></script>
</body>
</html>
