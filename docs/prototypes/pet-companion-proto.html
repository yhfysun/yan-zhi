<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宠物伴星 · 交互原型（对标 Codex Pets）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; background: #07090d; color: #dbe3ee; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 14px 12px 40px; }

  .proto-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
  .proto-head h1 { font-size: 15px; font-weight: 600; color: #eef2f8; }
  .proto-head .sub { font-size: 12px; color: #6d7a90; }
  .seg { display: flex; background: #12161d; border: 1px solid #232b37; border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; color: #8a97ab; font-size: 12px; padding: 5px 11px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: #e8734a; color: #fff; }
  .seg button .k { opacity: .55; font-size: 10px; margin-left: 4px; }

  /* ================= 舞台：模拟桌面 ================= */
  .stage { position: relative; width: 960px; max-width: 100%; height: 620px; border-radius: 18px; overflow: hidden;
           background: #0b0e14; border: 1px solid #1c2330; box-shadow: 0 24px 70px rgba(0,0,0,.55); user-select: none; }
  .wall { position: absolute; inset: 0;
          background: radial-gradient(120% 90% at 18% 12%, #2b3f77 0%, #17224a 38%, #0b1030 72%, #060818 100%); }
  .wall::after { content: ""; position: absolute; inset: 0; background:
          radial-gradient(40% 30% at 76% 28%, rgba(120,90,220,.32), transparent 70%),
          radial-gradient(30% 24% at 42% 72%, rgba(40,160,190,.22), transparent 70%); }
  /* 桌面上两个窗口剪影，演示宠物浮在其上 */
  .desk-win { position: absolute; border-radius: 10px; background: #141922f2; border: 1px solid #2a3342;
              box-shadow: 0 8px 30px rgba(0,0,0,.5); overflow: hidden; }
  .desk-win .wt { height: 30px; background: #1b2230; display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  .desk-win .wt i { width: 9px; height: 9px; border-radius: 50%; background: #ff5f57; display: inline-block; }
  .desk-win .wt i + i { background: #febc2e; } .desk-win .wt i + i + i { background: #28c840; }
  .desk-win .wb { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .desk-win .ln { height: 10px; border-radius: 4px; background: linear-gradient(90deg, #2a3444, #232c3a 80%); }
  .desk-win .ln.s { width: 55%; } .desk-win .ln.m { width: 78%; } .desk-win .ln.acc { background: linear-gradient(90deg, #e8734a88, #b3543a66); width: 34%; }
  .win-a { left: 4%; top: 9%; width: 42%; height: 60%; }
  .win-b { left: 52%; top: 16%; width: 30%; height: 42%; }
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: rgba(10,13,19,.86);
             backdrop-filter: blur(6px); border-top: 1px solid #232b37; display: flex; align-items: center; gap: 10px; padding: 0 14px; }
  .tb-ic { width: 18px; height: 18px; border-radius: 5px; background: rgba(160,190,240,.4); }
  .tb-ic.a2 { background: rgba(240,170,80,.45); } .tb-ic.a3 { background: rgba(120,220,170,.4); }
  .tb-clock { margin-left: auto; font-size: 11px; color: #cdd6e2; }
  .stage-hint { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,.34);
                letter-spacing: .5px; pointer-events: none; }

  /* ================= 宠物本体 ================= */
  .pet { position: absolute; width: 112px; height: 118px; left: 640px; top: 380px; cursor: grab; z-index: 30;
         touch-action: none; transition: filter .25s; }
  .pet.dragging { cursor: grabbing; transition: none; }
  .pet[data-state="running"]     .pet[data-state="ready"]       .pet[data-state="error"]       .pet[data-state="paused"]    
  .pet svg { width: 100%; height: 100%; overflow: visible; }
  .pet-body-g { transform-origin: 60px 76px; animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scaleY(1) scaleX(1); } 50% { transform: scaleY(1.035) scaleX(.985); } }
  .pet[data-state="running"] .pet-body-g { transform-origin: 60px 110px; animation: hop .62s ease-in-out infinite; }
  @keyframes hop { 0%,100% { transform: translateY(0); } 45% { transform: translateY(-7px); } 60% { transform: translateY(0); } }
  .pet[data-state="ready"] .pet-body-g { animation: hop .5s ease-in-out 3; }
  .pet[data-state="error"] .pet-body-g { animation: shake .5s ease-in-out 2; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-2deg); } 75% { transform: translateX(5px) rotate(2deg); } }
  .pet[data-state="paused"] .pet-body-g { animation: breathe 4.6s ease-in-out infinite; }
  .tail { transform-origin: 88px 88px; animation: tailwag 2.6s ease-in-out infinite; }
  @keyframes tailwag { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(9deg); } }
  .pet[data-state="running"] .tail { animation-duration: .8s; }

  .eye { transform-origin: center; animation: blink 4.4s infinite; }
  .eye2 { animation-delay: .06s; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  .pet[data-state="paused"] .eye { animation: none; transform: scaleY(.08); }
  .pet[data-state="paused"] .eye2 { animation: none; transform: scaleY(.08); }
  .pet[data-state="running"] .eye { animation: none; transform: scaleY(.72); }
  .pet[data-state="running"] .eye2 { animation: none; transform: scaleY(.72); }
  .pet[data-state="ready"] .eye-open, .pet[data-state="error"] .eye-open { opacity: 0; }
  .pet[data-state="ready"] .eye-happy, .pet[data-state="error"] .eye-x { opacity: 1; }



  /* 宠物底下的名字牌（hover 或需要处理时出现） */
  .pet-tag { position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%); font-size: 11px; color: #cdd6e2;
             background: rgba(16,20,30,.92); border: 1px solid #2a3342; padding: 3px 10px; border-radius: 8px;
             white-space: nowrap; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .pet:hover .pet-tag, .pet[data-state="needs-input"] .pet-tag, .pet[data-state="error"] .pet-tag { opacity: 1; }

  /* ===== 快问输入条（hover 宠物出现，Enter 直接开工）===== */
  .ask-pill { position: absolute; top: 122px; left: 50%; transform: translateX(-50%) translateY(5px);
              display: flex; align-items: center; gap: 5px; width: 236px; padding: 5px 6px;
              background: rgba(17,21,31,.97); border: 1px solid #2c3648; border-radius: 21px;
              box-shadow: 0 12px 34px rgba(0,0,0,.5); opacity: 0; pointer-events: none;
              transition: opacity .18s, transform .18s; z-index: 6; }
  .pet:hover .ask-pill, .ask-pill.focus { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .ask-agent { border: 0; background: #1a2130; color: #e8b49a; font-size: 10px; padding: 4px 8px;
               border-radius: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .ask-agent:hover { background: #223049; }
  .ask-pill input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
                    color: #dbe3ee; font-size: 11px; }
  .ask-pill input::placeholder { color: #55617a; }
  .ask-btn { width: 22px; height: 22px; border: 0; border-radius: 50%; background: transparent; color: #8a97ab;
             font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ask-btn:hover { background: #223049; color: #fff; }
  .ask-btn.go { color: #e8734a; }
  .ask-btn.go:hover { background: rgba(232,115,74,.15); }

  /* ===== 形象切换托盘 ===== */
  .char-tray { position: absolute; bottom: 128px; left: 50%; transform: translateX(-50%); display: none; gap: 6px;
               padding: 8px 10px; background: rgba(17,21,31,.97); border: 1px solid #2a3342; border-radius: 14px;
               box-shadow: 0 12px 34px rgba(0,0,0,.5); z-index: 7; }
  .char-tray.open { display: flex; }
  .char-tray .chr { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 56px; padding: 6px 0 4px;
                    border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
  .char-tray .chr:hover { background: #1c2434; border-color: #2c3648; }
  .char-tray .chr.on { border-color: #e8734a; background: rgba(232,115,74,.12); }
  .char-tray .chr svg { width: 42px; height: 42px; overflow: visible; }
  .char-tray .chr .chr-pack { width: 42px; height: 45.5px; background-repeat: no-repeat; }

  .char-tray .chr span { font-size: 10px; color: #8a97ab; }
  .char-tray .chr.on span { color: #e8b49a; font-weight: 600; }

  /* ===== 逗一下 · 动作条（贴宠物上方，横排胶囊）===== */
  .play-bar { position: absolute; left: 0; top: 0; display: none; gap: 4px; padding: 6px;
              background: rgba(17,21,31,.97); border: 1px solid #2a3342; border-radius: 15px;
              box-shadow: 0 12px 34px rgba(0,0,0,.5); z-index: 38; white-space: nowrap; }
  .play-bar.open { display: flex; animation: pb-in .16s cubic-bezier(.2,.9,.3,1); }
  @keyframes pb-in { from { opacity: 0; transform: translateY(8px) scale(.95); } }
  .play-bar .act { display: flex; align-items: center; gap: 4px; border: 1px solid transparent; background: #1a2130;
                   color: #cdd8ea; font-size: 10.5px; padding: 5px 9px; border-radius: 11px; cursor: pointer; }
  .play-bar .act .g { font-size: 12px; line-height: 1; filter: saturate(.85); }
  .play-bar .act:hover { background: #223049; border-color: #3a4a66; color: #fff; }
  .play-bar .act.on { border-color: #e8734a; background: rgba(232,115,74,.14); color: #e8b49a; }

  /* ===== 四肢（chibi 全身像：手/脚随状态摆动）===== */
  .arm-l, .arm-r, .leg-l, .leg-r { transform-box: fill-box; }
  .arm-l, .arm-r { transform-origin: 50% 12%; }
  .leg-l, .leg-r { transform-origin: 50% 10%; }
  @keyframes limb-idle { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
  .pet .arm-l { animation: limb-idle 3.4s ease-in-out infinite; }
  .pet .arm-r { animation: limb-idle 3.4s ease-in-out infinite reverse; }
  .pet .leg-l { animation: limb-idle 4.2s ease-in-out infinite; }
  .pet .leg-r { animation: limb-idle 4.2s ease-in-out infinite reverse; }

  @keyframes limb-run { from { transform: rotate(-38deg); } to { transform: rotate(38deg); } }
  .pet[data-state="running"] .arm-l { animation: limb-run .32s ease-in-out infinite alternate; }
  .pet[data-state="running"] .arm-r { animation: limb-run .32s ease-in-out infinite alternate-reverse; }
  .pet[data-state="running"] .leg-l { animation: limb-run .3s ease-in-out infinite alternate; }
  .pet[data-state="running"] .leg-r { animation: limb-run .3s ease-in-out infinite alternate-reverse; }

  /* 闲逛踱步（Shimeji 风） */
  @keyframes waddle { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-3px) rotate(2deg); } }
  .pet[data-state="walking"] .pet-body-g { transform-origin: 60px 76px; animation: waddle .55s ease-in-out infinite; }
  .pet[data-state="walking"] .arm-l { animation: limb-run .55s ease-in-out infinite alternate-reverse; }
  .pet[data-state="walking"] .arm-r { animation: limb-run .55s ease-in-out infinite alternate; }
  .pet[data-state="walking"] .leg-l { animation: limb-run .55s ease-in-out infinite alternate; }
  .pet[data-state="walking"] .leg-r { animation: limb-run .55s ease-in-out infinite alternate-reverse; }
  .pet[data-state="walking"] .tail { animation-duration: .5s; }

  /* 被拖拽：吊在光标上四肢乱蹬（置于最后，覆盖 running 等） */
  @keyframes limb-flail { from { transform: rotate(-30deg); } to { transform: rotate(30deg); } }
  .pet.dragging .arm-l { animation: limb-flail .26s ease-in-out infinite alternate; }
  .pet.dragging .arm-r { animation: limb-flail .26s ease-in-out infinite alternate-reverse; }
  .pet.dragging .leg-l { animation: limb-flail .32s ease-in-out infinite alternate; }
  .pet.dragging .leg-r { animation: limb-flail .32s ease-in-out infinite alternate-reverse; }
  .pet.dragging .pet-body-g { transform-origin: 60px 40px; animation: dangle .9s ease-in-out infinite; }
  @keyframes dangle { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

  /* ===== 物种特化：鸟 = 飞行（扑翅+悬浮+腿收起）；兔 = 双脚跳 ===== */
  @keyframes flap { from { transform: rotate(-55deg); } to { transform: rotate(32deg); } }
  /* 飞行：run/walk 态翅膀大幅扑扇 */
  .pet[data-char="bird"][data-state="running"] .arm-l,
  .pet[data-char="bird"][data-state="walking"] .arm-l { animation: flap .3s ease-in-out infinite alternate; }
  .pet[data-char="bird"][data-state="running"] .arm-r,
  .pet[data-char="bird"][data-state="walking"] .arm-r { animation: flap .3s ease-in-out infinite alternate-reverse; }
  .pet.dragging[data-char="bird"] .arm-l { animation: flap .22s ease-in-out infinite alternate; }
  .pet.dragging[data-char="bird"] .arm-r { animation: flap .22s ease-in-out infinite alternate-reverse; }
  /* 飞行悬浮起伏 */
  .pet[data-char="bird"][data-state="running"] .pet-body-g,
  .pet[data-char="bird"][data-state="walking"] .pet-body-g { transform-origin: 60px 76px; animation: fly-bob .6s ease-in-out infinite; }
  /* 飞行时细腿收向后方 */
  .pet[data-char="bird"][data-state="running"] .leg-l,
  .pet[data-char="bird"][data-state="running"] .leg-r,
  .pet[data-char="bird"][data-state="walking"] .leg-l,
  .pet[data-char="bird"][data-state="walking"] .leg-r { animation: none; transform: rotate(58deg) translateY(3px); }
  /* 兔：走路小跳 / 奔跑大跳 */
  .pet[data-char="rabbit"][data-state="walking"] .pet-body-g { transform-origin: 60px 110px; animation: hop-sm .7s ease-in-out infinite; }
  .pet[data-char="rabbit"][data-state="running"] .pet-body-g { transform-origin: 60px 110px; animation: hop-lg .52s ease-in-out infinite; }
  /* 兔长耳：轻摆；奔跑快速摆；被拖拽时向下耷拉 */
  .pet[data-char="rabbit"] .ear-l, .pet[data-char="rabbit"] .ear-r { transform-box: fill-box; transform-origin: 50% 92%; }
  @keyframes ear-sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
  .pet[data-char="rabbit"] .ear-l { animation: ear-sway 3s ease-in-out infinite; }
  .pet[data-char="rabbit"] .ear-r { animation: ear-sway 3s ease-in-out infinite reverse; }
  .pet[data-char="rabbit"][data-state="running"] .ear-l { animation: ear-sway .5s ease-in-out infinite; }
  .pet[data-char="rabbit"][data-state="running"] .ear-r { animation: ear-sway .5s ease-in-out infinite reverse; }
  .pet.dragging[data-char="rabbit"] .ear-l { animation: none; transform: rotate(42deg); }
  .pet.dragging[data-char="rabbit"] .ear-r { animation: none; transform: rotate(-42deg); }

  /* ===== 真实宠物包（Codex 格式精灵图）：192x208 帧，8 列 x 11 行 ===== */
  .pet-sprite { position: absolute; left: 50%; bottom: 0; width: 109px; height: 118px; margin-left: -54.5px;
                background-repeat: no-repeat; display: none; pointer-events: none; z-index: 1; }
  .pet[data-char^="pack-"] .pet-sprite { display: block; }
  .pet[data-char^="pack-"] #petSvgHost { display: none; }

  /* ===== 逗一下的瞬态动作层：只动精灵图，不动状态机 ===== */
  .pet[data-action] .pet-sprite { transform-origin: 50% 88%; }
  .pet[data-action="shy"] .pet-sprite { animation: act-shy 1.05s cubic-bezier(.3,.9,.3,1); }
  @keyframes act-shy {
    0%   { transform: rotate(0deg) scale(1,1); }
    22%  { transform: rotate(-5deg) scale(.95,1.05) translateY(-2px); }
    58%  { transform: rotate(-4deg) scale(.96,1.04) translateY(-1px); }
    100% { transform: rotate(0deg) scale(1,1); }
  }
  .pet[data-action="look"] .pet-sprite { animation: act-look 2.2s ease-in-out; }
  @keyframes act-look {
    0%,100% { transform: rotate(0deg) translateX(0); }
    16%     { transform: rotate(-4deg) translateX(-3px); }
    38%     { transform: rotate(4deg) translateX(3px); }
    62%     { transform: rotate(-3deg) translateX(-2px); }
    84%     { transform: rotate(2deg) translateX(2px); }
  }
  /* 转圈：绕竖轴转一整圈（不是平面旋转）；透视让侧面有体积，起手先反向蓄力 */
  .pet[data-action="spin"] .pet-sprite { animation: act-spin .9s cubic-bezier(.4,.02,.35,1); }
  @keyframes act-spin {
    0%   { transform: perspective(600px) rotateY(0deg) scale(1,1); }
    14%  { transform: perspective(600px) rotateY(-16deg) scale(.985,1.015); }
    50%  { transform: perspective(600px) rotateY(180deg) scale(1,1); }
    86%  { transform: perspective(600px) rotateY(344deg) scale(.985,1.015); }
    100% { transform: perspective(600px) rotateY(360deg) scale(1,1); }
  }
  .pet[data-action="nap"] .pet-sprite { animation: act-nap 1.6s ease-in-out infinite; }
  @keyframes act-nap { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(2px) scale(1.015,.97); } }
  .pet[data-action="hop"] .pet-sprite { animation: hop-lg .78s cubic-bezier(.35,.9,.3,1); }
  .pet[data-action="hop"] .pet-shadow { animation: shadow-hop-lg .78s ease-in-out; }

  /* ===== 动画品质层： Disney 十二原则的 CSS 化 ===== */
  /* 落地影子：身体升空时影子缩小变淡（高度感），落地瞬间放大（重量感） */
  .pet-shadow { position: absolute; left: 50%; bottom: -7px; width: 78px; height: 13px; margin-left: -39px;
                border-radius: 50%; pointer-events: none;
                background: radial-gradient(closest-side, rgba(0,0,0,.4), rgba(0,0,0,0) 72%);
                animation: shadow-breathe 3.2s ease-in-out infinite; }
  @keyframes shadow-breathe { 0%,100% { transform: scale(1); opacity:.9; } 50% { transform: scale(.95); opacity:.75; } }
  @keyframes shadow-run { 0%,100% { transform: scale(1); opacity:.9; } 45% { transform: scale(.78); opacity:.5; } }
  @keyframes shadow-waddle { 0%,100% { transform: scale(1); } 50% { transform: scale(.92); } }
  @keyframes shadow-fly { 0%,100% { transform: scale(1); opacity:.85; } 50% { transform: scale(.8); opacity:.5; } }
  @keyframes shadow-hop-sm { 0%,100% { transform: scale(1); opacity:.9; } 30% { transform: scale(.8); opacity:.5; } 55% { transform: scale(1.06); opacity:.95; } }
  @keyframes shadow-hop-lg { 0%,100% { transform: scale(1); opacity:.9; } 32% { transform: scale(.74); opacity:.45; } 50% { transform: scale(1.1); opacity:1; } }
  .pet[data-state="running"] .pet-shadow { animation: shadow-run .62s ease-in-out infinite; }
  .pet[data-state="walking"] .pet-shadow { animation: shadow-waddle .55s ease-in-out infinite; }
  .pet[data-char="bird"][data-state="running"] .pet-shadow,
  .pet[data-char="bird"][data-state="walking"] .pet-shadow { animation: shadow-fly .6s ease-in-out infinite; }
  .pet[data-char="rabbit"][data-state="walking"] .pet-shadow { animation: shadow-hop-sm .7s ease-in-out infinite; }
  .pet[data-char="rabbit"][data-state="running"] .pet-shadow { animation: shadow-hop-lg .52s ease-in-out infinite; }

  /* 状态切换 pop（Toyful：进入新状态的 overshoot 回弹） */
  .pet.state-pop { animation: state-pop .34s cubic-bezier(.34,1.56,.64,1); }
  @keyframes state-pop { 0% { transform: scale(.87); } 100% { transform: scale(1); } }

  /* 瞳孔追踪鼠标（Bongo Cat 动态眼）：pupil 由 --px/--py 驱动，带缓动跟随 */
  .pet .eye .pupil { transition: transform .15s ease-out; transform: translate(var(--px,0px), var(--py,0px)); }

  /* 跳跃 squash & stretch：蓄力压扁 → 腾空拉长 → 落地压扁（体积守恒），原点在地面 */
  @keyframes hop {
    0%,100% { transform: translateY(0) scale(1,1); }
    16% { transform: translateY(1px) scale(1.05,.93); }
    45% { transform: translateY(-9px) scale(.95,1.07); }
    62% { transform: translateY(0) scale(1.08,.9); }
    78% { transform: translateY(-2px) scale(.99,1.02); }
  }
  @keyframes hop-sm {
    0%,100% { transform: translateY(0) scale(1,1); }
    30% { transform: translateY(-11px) scale(.94,1.09); }
    55% { transform: translateY(0) scale(1.07,.92); }
    72% { transform: translateY(-4px) scale(.98,1.03); }
  }
  @keyframes hop-lg {
    0%,100% { transform: translateY(0) scale(1,1); }
    12% { transform: translateY(1px) scale(1.06,.9); }
    32% { transform: translateY(-16px) scale(.92,1.12); }
    50% { transform: translateY(0) scale(1.1,.87); }
    66% { transform: translateY(-6px) scale(.97,1.05); }
    82% { transform: translateY(0) scale(1.02,.98); }
  }
  @keyframes leg-tuck { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-4px); } 50% { transform: translateY(1px) scaleY(.82); } }
  .pet[data-char="rabbit"][data-state="running"] .leg-l,
  .pet[data-char="rabbit"][data-state="running"] .leg-r { animation: leg-tuck .52s ease-in-out infinite; }

  /* 飞行摇摆（bird）：上下起伏 + 前后 2.5° 倾斜 */

<script>
/* ================= 图标（统一线条风格） ================= */
const ICONS = {
  newTask:  '<svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z"/><path d="M13.5 7.5l3 3"/></svg>',

  shot:     '<svg viewBox="0 0 24 24"><path d="M7 3v3a1 1 0 01-1 1H3M17 3v3a1 1 0 001 1h3M7 21v-3a1 1 0 00-1-1H3M17 21v-3a1 1 0 011-1h3"/></svg>',
  remote:   '<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  agent:    '<svg viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3"/><circle cx="9.5" cy="13" r="1.2"/><circle cx="14.5" cy="13" r="1.2"/><path d="M12 8V4.5M12 4.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/></svg>',
  pause:    '<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>',
  resume:   '<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7V5z"/></svg>',
  stop:     '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  pin:      '<svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3.5 3H6.5L10 10 9 4z"/><path d="M12 13v7"/></svg>',
  chat:     '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></svg>',
  play:     '<svg viewBox="0 0 24 24"><path d="M11 3l1.5 4.2L16.7 8.7l-4.2 1.5L11 14.4 9.5 10.2 5.3 8.7l4.2-1.5z"/><path d="M17.5 14l.8 2.3 2.2.8-2.2.8-.8 2.3-.8-2.3-2.2-.8 2.2-.8z"/></svg>',
};

/* 形象系统：仅使用开源宠物包（Codex 精灵图格式），手绘 SVG 已移除 */
let curChar = localStorage.getItem('yz:pet:char') || 'pack-boba';

/* 命令注册表（实施时对应 app 内既有动作） */
const COMMANDS = {

  play:     { icon: 'play',     label: '逗一下' },
};

/* 常用菜单槽位（默认 6 个，可编辑；实施时持久化到 settings） */
let slots = ['newTask', 'panel', 'play', 'bell', 'hide', 'settings'];

/* ================= 演示任务数据 ================= */
let seq = 6;
let tasks = [
  { id: 't1', title: '整理三季度销售数据并生成对比报表', status: 'running', plan: { done: 2, total: 5 }, elapsed: 412, agent: '办公助手' },
  { id: 't2', title: '抓取竞品价格并输出分析', status: 'needs-input', agent: 'pageAgent', elapsed: 1220,
    question: '找到 3 个数据源（京东/淘宝/1688），全部抓取还是只抓前两个？' },
  { id: 't3', title: '产品周报草稿润色', status: 'paused', plan: { done: 1, total: 3 }, elapsed: 1204, agent: '办公助手' },
  { id: 't4', title: '生成新品封面图 3 张', status: 'completed', elapsed: 934, unread: true, agent: '剪辑师' },
  { id: 't5', title: '同步库存表到 NAS', status: 'error', elapsed: 260, agent: '办公助手', msg: '网络超时，已自动重试 2 次仍失败' },
];
let muted = false;
let pinnedId = null;   // 手动 pin 的任务（null = 自动跟随最高优先级）
let forcedState = null; // 顶部 seg 强制覆盖（原型预览用）
let editMode = false, pickedSlot = -1;

/* ================= 状态机与渲染 ================= */
const PRIO = { 'needs-input': 5, error: 4, ready: 3, paused: 2, running: 1, completed: 0 };
const stateOf = (t) => t.status === 'completed' && t.unread ? 'ready' : t.status;
function pickFocus() {
  if (pinnedId) { const p = tasks.find((t) => t.id === pinnedId); if (p) return p; }
  return [...tasks].sort((a, b) => PRIO[stateOf(b)] - PRIO[stateOf(a)])[0] || null;
}
function petState() {
  if (forcedState) return forcedState;
  const f = pickFocus();
  if (!f) return 'idle';
  const s = stateOf(f);
  return s === 'completed' ? 'ready' : s;
}

const petTag = document.getElementById('petTag');
const panel = document.getElementById('panel');

const candidates = document.getElementById('candidates');
const stage = document.getElementById('stage');

const STATE_TXT = {
  idle: '在打盹 · 一切就绪',

  error: '任务出错了',
};
function fmt(sec) { sec = Math.max(0, sec | 0); const m = (sec / 60) | 0, s = sec % 60; return m > 0 ? `${m} 分 ${s} 秒` : `${s} 秒`; }
function fmtT(sec) { sec = Math.max(0, sec | 0); return `${String((sec / 60) | 0).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; }

function renderPet() {

/* ---------- 任务小面板 ---------- */
const SECTIONS = [
  { key: 'need',  label: '需要处理', match: (t) => t.status === 'needs-input' || t.status === 'error' },
  { key: 'run',   label: '进行中',   match: (t) => t.status === 'running' || t.status === 'paused' },
  { key: 'done',  label: '刚完成',   match: (t) => t.status === 'completed' },
];
function renderPanel() {
  const runN = tasks.filter((t) => ['running', 'paused'].includes(t.status)).length;
  const needN = tasks.filter((t) => SECTIONS[0].match(t)).length;
  let h = `<div class="pp-head"><b>任务</b><span class="pp-count">${runN} 进行 · ${needN} 待处理</span>
    <button class="pp-icon-btn ${muted ? 'on' : ''}" id="ppMute" title="静音通知">${ICONS.bell}</button>
    <button class="pp-icon-btn" id="ppClose" title="关闭">✕</button></div><div class="pp-body">`;
  if (!tasks.length) h += `<div class="pp-empty">没有任务 —— 点半圆菜单「新建任务」开始</div>`;
  for (const sec of SECTIONS) {
    const list = tasks.filter(sec.match);
    if (!list.length) continue;
    h += `<div class="pp-sec">${sec.label}</div>`;
    for (const t of list) {
      const cls = t.status === 'completed' && t.unread ? 'ready' : t.status;
      h += `<div class="pp-row is-${cls}" data-id="${t.id}">
        <span class="pp-dot"></span>
        <div class="pp-main">
          <div class="pp-title">${t.title}${pinnedId === t.id ? ' 📌' : ''}</div>
          <div class="pp-meta">${t.agent || ''} · 已用 ${fmt(t.elapsed)}${t.plan ? ` · 步骤 ${t.plan.done}/${t.plan.total}` : ''}</div>
          ${t.plan ? `<div class="pp-plan"><i style="width:${Math.round(t.plan.done / t.plan.total * 100)}%"></i></div>` : ''}
          ${t.status === 'needs-input' ? `<div class="pp-q">${t.question || '智能体在等你补充信息'}
            <div class="pp-answer"><input placeholder="快答…" data-q="${t.id}"><button data-send="${t.id}">发送</button></div></div>` : ''}
          ${t.status === 'error' ? `<div class="pp-q" style="color:#f0a09a;background:rgba(235,90,80,.08);border-color:rgba(235,90,80,.25)">${t.msg || '任务执行失败'}</div>` : ''}
        </div>
        <div class="pp-acts">
          ${t.status === 'running' ? `<button class="pp-act" data-act="pause" data-id="${t.id}">暂停</button>` : ''}
          ${t.status === 'paused' ? `<button class="pp-act" data-act="resume" data-id="${t.id}">恢复</button>` : ''}
          ${t.status === 'error' ? `<button class="pp-act" data-act="retry" data-id="${t.id}">重试</button>` : ''}
          ${t.status === 'completed' && t.unread ? `<button class="pp-act" data-act="view" data-id="${t.id}">查看</button>` : ''}
          <button class="pp-act pin ${pinnedId === t.id ? 'on' : ''}" data-act="pin" data-id="${t.id}" title="让宠物跟随这个任务">📌</button>
        </div>
      </div>`;
    }
  }
  h += `</div><div class="pp-foot"><button id="ppAll">打开全部任务 →</button><span style="font-size:10px;color:#55617a">点击行 = 跳转会话</span></div>`;
  panel.innerHTML = h;
  panel.querySelector('#ppClose').onclick = () => togglePanel(false);
  panel.querySelector('#ppMute').onclick = () => { muted = !muted; renderPet(); renderPanel(); toast(muted ? '已静音宠物通知' : '已恢复通知', '', 't-ok'); };
  panel.querySelector('#ppAll').onclick = () => { toast('演示', '将打开主窗口的任务列表（活动列表页）', 't-ok'); };
  panel.querySelectorAll('.pp-row').forEach((r) => {
    r.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('input')) return;
      toast('演示', `跳转到会话「${tasks.find((t) => t.id === r.dataset.id)?.title.slice(0, 12)}…」（主窗口前置并选中该会话）`, 't-ok');
    });
  });
  panel.querySelectorAll('[data-send]').forEach((b) => b.onclick = () => {
    const id = b.dataset.send, input = panel.querySelector(`input[data-q="${id}"]`);
    const t = tasks.find((x) => x.id === id);
    t.status = 'running'; t.plan = { done: 3, total: 5 };
    toast('已回答', `「${(input.value || '（默认继续）').slice(0, 14)}」已并入任务，继续执行`, 't-ok');
    refresh();
  });
  panel.querySelectorAll('[data-act]').forEach((b) => b.onclick = (e) => {
    e.stopPropagation();

    if (b.dataset.act === 'pause') { t.status = 'paused'; toast('已暂停', t.title.slice(0, 18) + '…', 't-ok'); }
    if (b.dataset.act === 'resume') { t.status = 'running'; toast('已恢复', t.title.slice(0, 18) + '…', 't-ok'); }
    if (b.dataset.act === 'retry') { t.status = 'running'; t.msg = ''; t.elapsed = 0; toast('重试中', t.title.slice(0, 18) + '…', 't-ok'); }
    if (b.dataset.act === 'view') { t.unread = false; toast('演示', '跳转到该会话查看交付结果', 't-ok'); }
    if (b.dataset.act === 'pin') { pinnedId = pinnedId === t.id ? null : t.id; toast(pinnedId ? '宠物已跟随该任务' : '已回到自动跟随', '', 't-ok'); }
    refresh();
  });
}

/* ---------- 半圆菜单 ---------- */
/* 6 槽时弧半径放大，避免 52px 槽位相切 */
function slotRadius(n) { return n >= 6 ? 114 : 96; }
function slotPos(i, n, r) {
  const start = 168, end = 12; // 上半圆弧（度）
  const a = (start - (start - end) * (n === 1 ? .5 : i / (n - 1))) * Math.PI / 180;
  return { x: Math.cos(a) * r, y: -Math.sin(a) * r };
}
function renderRadial() {
  radial.innerHTML = slots.map((k, i) => {
    const c = COMMANDS[k];
    return `<div class="slot" data-i="${i}" data-key="${k}">${ICONS[c.icon]}<span class="sl">${c.label}</span><span class="pin-dot"></span></div>`;
  }).join('');
  radial.querySelectorAll('.slot').forEach((s) => {
    const { x, y } = slotPos(+s.dataset.i, slots.length, slotRadius(slots.length));
    s.style.setProperty('--tx', `${x}px`); s.style.setProperty('--ty', `${y}px`);
    s.onclick = () => {
      if (editMode) { pickedSlot = +s.dataset.i; renderRadial(); renderCandidates(); return; }
      doCommand(s.dataset.key);
      closeRadial();
    };
  });
  requestAnimationFrame(() => {
    radial.querySelectorAll('.slot').forEach((s) => {
      s.style.transform = `translate(${s.style.getPropertyValue('--tx')},${s.style.getPropertyValue('--ty')}) scale(1)`;
    });
  });
}
function renderCandidates() {
  const pool = Object.keys(COMMANDS).filter((k) => !slots.includes(k));
  candidates.innerHTML = `<span class="cap" style="font-size:10px;color:#66738c;padding:4px 2px">点槽位选中，点候选替换：</span>` +
    pool.map((k) => `<div class="cand" data-key="${k}">${ICONS[COMMANDS[k].icon]}<span class="cl">${COMMANDS[k].label}</span></div>`).join('');
  candidates.querySelectorAll('.cand').forEach((c) => c.onclick = () => {
    if (pickedSlot < 0) return;
    slots[pickedSlot] = c.dataset.key;
    pickedSlot = -1; renderRadial(); renderCandidates();
  });
}
function openRadial(px, py) {
  closePlayBar();
  radial.style.left = px + 'px'; radial.style.top = py + 'px';
  radial.classList.add('open');
  radial.classList.toggle('editing', editMode);
  renderRadial();
  // 靠近舞台顶部时翻转到下半圆
  const flip = py < 190;
  radial.querySelectorAll('.slot').forEach((s, i) => {
    const { x, y } = slotPos(i, slots.length, slotRadius(slots.length));
    s.style.transform = `translate(${x}px,${flip ? -y : y}px) scale(1)`;
  });
  if (editMode) {
    candidates.style.left = Math.max(12, Math.min(px - 210, stage.clientWidth - 440)) + 'px';
    candidates.style.top = (flip ? py + 60 : py - 60) + 'px';
    candidates.classList.add('open'); renderCandidates();
  }
}
function closeRadial() { radial.classList.remove('open'); candidates.classList.remove('open'); radial.innerHTML = ''; }

function doCommand(key) {
  const M = {
    newTask: () => toast('演示', '打开主窗口并新建任务草稿（聚焦输入框）', 't-ok'),
    panel: () => togglePanel(true),
    bell: () => { muted = !muted; renderPet(); toast(muted ? '已静音' : '已恢复通知', '', 't-ok'); },
    hide: () => toast('演示', '隐藏宠物（托盘/快捷键可再次呼出）', 't-ok'),
    settings: () => toast('演示', '打开设置 → 宠物', 't-ok'),

    remote: () => toast('演示', '跳转远控页', 't-ok'),
    agent: () => toast('演示', '弹出智能体切换列表', 't-ok'),
    pause: () => { const t = tasks.find((x) => x.status === 'running'); if (t) { t.status = 'paused'; refresh(); } },
    resume: () => { const t = tasks.find((x) => x.status === 'paused'); if (t) { t.status = 'running'; refresh(); } },
    stop: () => { const t = pickFocus(); if (t) { tasks = tasks.filter((x) => x !== t); refresh(); } },
    chat: () => toast('演示', '跳到最近的未读会话', 't-ok'),
  };
  (M[key] || (() => {}))();
}

/* ---------- 通知 toast ---------- */
function toast(title, body, cls = 't-ok') {
  if (muted && cls !== 't-q') return;
  const zone = document.getElementById('toastZone');
  const el = document.createElement('div');
  el.className = 'toast ' + cls;
  const ico = cls === 't-ok' ? '✓' : cls === 't-q' ? '?' : '!';
  el.innerHTML = `<div class="toast-ic">${ico}</div><div><div class="toast-t">${title}</div><div class="toast-b">${body || ''}</div></div><span class="toast-x">✕</span>`;
  el.querySelector('.toast-x').onclick = () => el.remove();
  zone.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 5200);
  while (zone.children.length > 3) zone.firstChild.remove();
}

/* ---------- 宠物拖拽 / 点击 / 右键 ---------- */
let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0, downT = 0;
pet.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  dragging = true; moved = false; walking = false; pet.style.transition = '';
  if (actionOverride) clearAction();
  sx = e.clientX; sy = e.clientY;
  ox = pet.offsetLeft; oy = pet.offsetTop;
  pet.classList.add('dragging');
  pet.setPointerCapture(e.pointerId);
});
pet.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
  if (moved) {
    pet.style.left = Math.max(0, Math.min(ox + dx, stage.clientWidth - 112)) + 'px';
    pet.style.top = Math.max(0, Math.min(oy + dy, stage.clientHeight - 118)) + 'px';

  }
});
pet.addEventListener('pointerup', (e) => {
  dragging = false; pet.classList.remove('dragging');
  if (!moved && Date.now() - downT < 400) {
    // 菜单/托盘开着时，点宠物的第一下是「收起」，不再顺手开面板（互斥）
    if (radial.classList.contains('open')) { closeRadial(); return; }
    if (trayOpen) { toggleTray(false); return; }
    if (playBarOpen) { closePlayBar(); return; }

  const r = pet.getBoundingClientRect(), s = stage.getBoundingClientRect();
  const bw = playBar.offsetWidth, bh = playBar.offsetHeight;
  const petLeft = r.left - s.left, petTop = r.top - s.top;
  const left = Math.max(8, Math.min(petLeft + r.width / 2 - bw / 2, s.width - bw - 8));
  const top = petTop - bh - 10 < 8 ? petTop + r.height + 12 : petTop - bh - 10;  // 贴顶翻到下方
  playBar.style.left = left + 'px';
  playBar.style.top = top + 'px';
}

function openPlayBar() {
  playBarOpen = true;
  stopWander();            // 正踱步时把宠物停住，避免动作条与宠物错位
  closeRadial(); togglePanel(false); toggleTray(false);
  playBar.classList.add('open');
  renderPlayBar();
  positionPlayBar();
}
function closePlayBar() {
  playBarOpen = false;
  playBar.classList.remove('open');
  playBar.innerHTML = '';
}

function playAction(key) {
  const a = ACTIONS.find((x) => x.key === key);
  if (!a) return;
  const token = { key: a.key, row: a.row, n: a.n, fps: a.fps, segments: a.segments,
                  startedAt: performance.now(), until: performance.now() + a.dur };
  actionOverride = token;
  delete pet.dataset.action;
  if (a.css) { void pet.offsetWidth; pet.dataset.action = a.css; }   // 连点同一动作也能重播
  if (a.emote) burstEmote(a.emote);
  if (a.dust) setTimeout(spawnDust, 430);
  playBar.querySelectorAll('.act').forEach((b) => b.classList.toggle('on', b.dataset.act === a.key));
  setTimeout(() => { if (actionOverride === token) clearAction(); }, a.dur);
}

function clearAction() {
  actionOverride = null;
  delete pet.dataset.action;
  playBar.querySelectorAll('.act').forEach((b) => b.classList.remove('on'));
}

/* 快问输入：hover 出现，Enter / ↑ 直接派活 */
const askPill = document.getElementById('askPill');
const askInput = document.getElementById('askInput');
const askGo = document.getElementById('askGo');
const askAgentBtn = document.getElementById('askAgent');
const askMic = document.getElementById('askMic');
const AGENT_LIST = ['办公助手', 'pageAgent', '剪辑师', '工作流助手'];
let askAgentIdx = 0;
function submitAsk() {
  const v = askInput.value.trim();
  if (!v) return;
  askInput.value = '';
  tasks.unshift({ id: 'x' + (seq++), title: v, agent: AGENT_LIST[askAgentIdx], status: 'running', plan: { done: 0, total: 4 }, elapsed: 0 });
  refresh();
  toast('已派活', '「' + v.slice(0, 18) + '」已交给 ' + AGENT_LIST[askAgentIdx] + ' 执行', 't-ok');
}
askInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); submitAsk(); }
  if (e.key === 'Escape') askInput.blur();
});
askGo.addEventListener('click', submitAsk);
askAgentBtn.addEventListener('click', () => {
  askAgentIdx = (askAgentIdx + 1) % AGENT_LIST.length;
  askAgentBtn.textContent = AGENT_LIST[askAgentIdx];
});
askMic.addEventListener('click', () => toast('演示', '语音输入：实施时接系统听写', 't-q'));
askPill.addEventListener('focusin', () => askPill.classList.add('focus'));
askPill.addEventListener('focusout', () => askPill.classList.remove('focus'));
// 快问条/托盘内的指针事件不冒泡成宠物拖拽或开面板
['pointerdown', 'pointerup', 'contextmenu'].forEach((ev) => {
  askPill.addEventListener(ev, (e) => e.stopPropagation());
  document.getElementById('charTray').addEventListener(ev, (e) => e.stopPropagation());
});
// 面板打开时藏起快问条（避免重叠）
const _togglePanel = togglePanel;
togglePanel = function (on) { _togglePanel(on); askPill.style.display = panelOpen ? 'none' : ''; };
// 点外部收起形象托盘
document.addEventListener('pointerdown', (e) => {
  const el = e.target;
  if (!(el && el.closest)) return;
  if (!el.closest('.char-tray') && !el.closest('.pet')) toggleTray(false);
}, true);


/* 闲逛踱步（Shimeji 风）：idle 且无面板/托盘/动作条/拖拽时，偶尔左右走一段 */
let walking = false, walkTimer = 0;
function stopWander() {
  if (!walking) return;
  clearTimeout(walkTimer);
  pet.style.transition = '';
  walking = false;
  renderPet();
}
function scheduleWander() {
  setTimeout(() => {
    if (petState() === 'idle' && !dragging && !panelOpen && !trayOpen && !playBarOpen && !forcedState) {
      const cur = parseInt(pet.style.left || '640', 10);
      const target = Math.max(10, Math.min(stage.clientWidth - 120, cur + (Math.random() * 2 - 1) * 260));
      if (Math.abs(target - cur) > 40) {
        walking = true;
        pet.dataset.state = 'walking';
        document.getElementById('petSvgHost').style.transform = target < cur ? 'scaleX(-1)' : '';
        const dur = Math.max(0.8, Math.abs(target - cur) / (curChar === 'bird' ? 190 : 110));
        pet.style.transition = 'left ' + dur.toFixed(2) + 's linear';
        pet.style.left = target + 'px';
        walkTimer = setTimeout(() => {
          pet.style.transition = '';
          walking = false;
          renderPet();
        }, dur * 1000);
      }
    }
    scheduleWander();
  }, 6000 + Math.random() * 8000);
}
scheduleWander();

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (playBarOpen) { closePlayBar(); return; }
  if (radial.classList.contains('open')) { closeRadial(); return; }
  if (trayOpen) { toggleTray(false); return; }
  if (panelOpen) { togglePanel(false); return; }
  if (document.activeElement === askInput) askInput.blur();
});

/* ===== 动画品质层 JS：情绪粒子 / 落地尘土 / 瞳孔追踪 / 空闲小动作 ===== */
let lastPetState = null;
function burstEmote(kind) {
  if (kind === 'star') {
    for (let i = 0; i < 5; i++) {
      const el = document.createElement('span');
      el.className = 'emote'; el.textContent = '\u2726';
      el.style.setProperty('--jx', (Math.random() * 52 - 26).toFixed(0) + 'px');
      el.style.setProperty('--js', (0.75 + Math.random() * 0.5).toFixed(2));
      el.style.setProperty('--ec', i % 2 ? '#f0b43c' : '#e8734a');
      el.style.animationDelay = (i * 60) + 'ms';
      el.style.left = (34 + Math.random() * 32) + '%';
      pet.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }
  } else if (kind === 'sweat') {
    for (let i = 0; i < 3; i++) {
      const el = document.createElement('span');
      el.className = 'emote-drop';
      el.style.setProperty('--jx', (Math.random() * 14 - 7).toFixed(0) + 'px');
      el.style.animationDelay = (i * 130) + 'ms';
      el.style.left = (i === 1 ? 50 : (i === 0 ? 30 : 68)) + '%';
      pet.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }
  } else if (kind === 'heart') {
    for (let i = 0; i < 4; i++) {
      const el = document.createElement('span');
      el.className = 'emote'; el.textContent = '♥';
      el.style.setProperty('--jx', (Math.random() * 34 - 17).toFixed(0) + 'px');
      el.style.setProperty('--js', (0.8 + Math.random() * 0.45).toFixed(2));
      el.style.setProperty('--ec', i % 2 ? '#f0708f' : '#ff96ae');
      el.style.animationDelay = (i * 110) + 'ms';
      el.style.left = (32 + Math.random() * 36) + '%';
      pet.appendChild(el);
      setTimeout(() => el.remove(), 1700);
    }
  } else if (kind === 'zzz') {
    for (let i = 0; i < 3; i++) {
      const el = document.createElement('span');
      el.className = 'emote'; el.textContent = 'z';
      el.style.setProperty('--jx', (10 + i * 7) + 'px');
      el.style.setProperty('--js', (0.9 + i * 0.25).toFixed(2));
      el.style.setProperty('--ec', '#93a9c9');
      el.style.fontSize = '11px';
      el.style.animationDelay = (i * 340) + 'ms';
      el.style.animationDuration = '1.9s';
      el.style.left = (58 + i * 6) + '%';
      pet.appendChild(el);
      setTimeout(() => el.remove(), 2700);
    }
  }
}
let dustTick = 0;
function spawnDust() {
  for (let i = 0; i < 2; i++) {
    const el = document.createElement('span');
    el.className = 'dust';
    el.style.setProperty('--dx', (Math.random() * 26 - 13).toFixed(0) + 'px');
    el.style.left = (36 + Math.random() * 28) + '%';
    pet.appendChild(el);
    setTimeout(() => el.remove(), 600);
  }
}
// 跳跃落地帧触发尘土（animationiteration = 每次循环的落地点）
document.addEventListener('animationiteration', (e) => {
  const an = e.animationName;
  if (an !== 'hop' && an !== 'hop-sm' && an !== 'hop-lg') return;
  if (++dustTick % 2) return;
  spawnDust();
});
// 瞳孔追鼠标（节流 90ms；幅度 ≤2px，Bongo Cat 参数化反馈）
let pxT = 0;
document.addEventListener('mousemove', (e) => {
  const now = Date.now(); if (now - pxT < 90) return; pxT = now;
  const r = pet.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy) || 1;
  const k = Math.min(2, d / 60);
  pet.style.setProperty('--px', (dx / d * k).toFixed(1) + 'px');
  pet.style.setProperty('--py', (dy / d * k * 0.7).toFixed(1) + 'px');
});
// 空闲小动作（7-14s 一次）：瞟一眼 / 伸懒腰 / 尾巴快摇——idle 不再只是呼吸
function idlePersona() {
  setTimeout(() => {
    if (petState() === 'idle' && !dragging && !panelOpen && !trayOpen && !playBarOpen && !actionOverride && !forcedState && !walking) {
      const host = document.getElementById('petSvgHost');
      const roll = Math.random();
      if (roll < 0.4) {
        const dir = Math.random() < 0.5 ? -3 : 3;
        pet.style.setProperty('--px', dir + 'px'); pet.style.setProperty('--py', '-1px');
        setTimeout(() => { pet.style.setProperty('--px', (dir > 0 ? -2 : 2) + 'px'); }, 700);
        setTimeout(() => { pet.style.setProperty('--px', '0px'); pet.style.setProperty('--py', '0px'); }, 1500);
      } else if (roll < 0.72) {
        host.classList.add('do-stretch');
        setTimeout(() => host.classList.remove('do-stretch'), 1700);
      } else {
        host.classList.add('happy-tail');
        setTimeout(() => host.classList.remove('happy-tail'), 1400);
      }
    }
    idlePersona();
  }, 7000 + Math.random() * 7000);
}
idlePersona();

/* ===== 开源宠物包（Codex pet.json + spritesheet.webp 格式）=====
   社区标准行序（9 行版）：0 待机 / 1 走 / 2 跑 / 3 挥手 / 4 等待 / 5 哭泣 / 6 得意 / 7 观察 / 8 侧身
   Boba 为 11 行版，第 9/10 行是拖拽侧身动作。素材来自 petdex.dev 开源画廊，演示用途。 */
const STD_STATES = {
  idle:          { r: 0, n: 6, fps: 5 },
  walking:       { r: 1, n: 8, fps: 10 },
  running:       { r: 2, n: 8, fps: 12 },
  ready:         { r: 3, n: 4, fps: 8 },
  'needs-input': { r: 4, n: 5, fps: 4 },
  error:         { r: 5, n: 8, fps: 6 },
  paused:        { r: 6, n: 6, fps: 2.5 },
  dragged:       { r: 2, n: 8, fps: 12 },
};
const PACKS = {
  'pack-boba': {
    name: 'Boba', label: '水獭 · railly',
    img: 'assets/boba-spritesheet.webp',
    fw: 192, fh: 208, cols: 8, rows: 11,
    states: {
      idle:          { r: 0, n: 7, fps: 5 },
      walking:       { r: 1, n: 8, fps: 10 },
      running:       { r: 2, n: 8, fps: 12 },
      'needs-input': { r: 4, n: 5, fps: 4 },
      paused:        { r: 6, n: 6, fps: 2.5 },
      ready:         { r: 3, n: 4, fps: 8 },
      error:         { r: 5, n: 8, fps: 6 },
      dragged:       { r: 9, n: 8, fps: 10 },
    },
  },
  'pack-tiko':    { name: 'Tiko', label: '机器人', img: 'assets/tiko-spritesheet.webp',    fw: 192, fh: 208, cols: 8, rows: 9, states: STD_STATES },
  'pack-wangcai': { name: '旺财', label: '布偶猫', img: 'assets/wangcai-spritesheet.webp', fw: 192, fh: 208, cols: 8, rows: 9, states: STD_STATES },
  'pack-lulu':    { name: '噜噜', label: '水豚',   img: 'assets/lulu-spritesheet.webp',    fw: 192, fh: 208, cols: 8, rows: 9, states: STD_STATES },
  'pack-noir':    { name: 'Noir', label: '侦探蛛', img: 'assets/noir-spritesheet.webp',    fw: 192, fh: 208, cols: 8, rows: 9, states: STD_STATES },
  'pack-mallow':  { name: 'Mallow', label: '小怪', img: 'assets/mallow-spritesheet.webp',  fw: 192, fh: 208, cols: 8, rows: 9, states: STD_STATES },
};
const spriteEl = document.getElementById('petSprite');
let sprState = '', sprFrame = 0, sprLast = 0;
/* 帧循环用 setInterval（不用 rAF）：宠物独立窗会被系统节流/隐藏，setInterval 更稳 */
function spriteTick(ts) {
  const pack = PACKS[curChar];
  if (!pack) return;
  if (actionOverride && ts >= actionOverride.until) clearAction();
  const draggingNow = pet.classList.contains('dragging');
  const st = draggingNow ? 'dragged' : (pet.dataset.state === 'walking' ? 'walking' : petState());
  // 瞬态动作优先；拖拽时让位给拖拽反应
  const over = actionOverride && !draggingNow ? actionOverride : null;
  let cfg, key;
  if (over) {
    let row = over.row;
    if (over.segments) {
      const elapsed = ts - over.startedAt;      // 按时间切行，遮住转圈的侧面帧
      for (const [from, r] of over.segments) if (elapsed >= from) row = r;
    }
    cfg = { r: row, n: over.n, fps: over.fps };
    key = 'act:' + over.key + ':' + row;
  } else {
    cfg = pack.states[st] || pack.states.idle;
    key = st;
  }
  if (key !== sprState) { sprState = key; sprFrame = 0; sprLast = 0; }
  const interval = 1000 / cfg.fps;
  if (ts - sprLast >= interval) {
    sprLast = ts;
    sprFrame = (sprFrame + 1) % cfg.n;
    const scale = 118 / pack.fh;
    const row = Math.min(cfg.r, pack.rows - 1);
    spriteEl.style.backgroundPosition =
      (-(sprFrame * pack.fw * scale)).toFixed(1) + 'px ' + (-(row * pack.fh * scale)).toFixed(1) + 'px';
  }
}
setInterval(() => spriteTick(performance.now()), 60);
renderPetSvg();

renderPet(); renderPanel();
</script>
