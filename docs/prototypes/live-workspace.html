<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>直播页 · 三栏工作台布局原型</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #11151c;
    --border: #2a3240;
    --text: #c8d0de;
    --dim: #8b93a3;
    --primary: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 20px 24px;
  }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .page-title { margin: 0; font-size: 18px; }
  .page-sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .status {
    font-size: 12px; color: var(--dim);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px;
  }
  .btn {
    appearance: none; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 6px; padding: 6px 12px; font-size: 12px;
  }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: #08101c; font-weight: 600; }
  .btn--danger { border-color: #ff6b6b; color: #ff8b8b; }

  /* ---------- 三栏布局 ---------- */
  .layout {
    --stage-h: min(72vh, 660px);
    display: flex;
    gap: 18px;
    align-items: flex-start;
  }

  .stage-wrap { position: sticky; top: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 0 0 auto; }
  .stage {
    position: relative;
    height: var(--stage-h);
    aspect-ratio: 9 / 16;
    border-radius: 18px;
    overflow: hidden;
    background: radial-gradient(70% 55% at 50% 42%, #2a2440 0%, #171327 55%, #0a0810 100%);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    display: flex; align-items: center; justify-content: center;
  }
  .stage-pet {
    width: 46%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 40% 32%, #ffd479, #f5a623 60%, #d98200);
    box-shadow: inset 0 -8px 18px rgba(0,0,0,.25);
  }
  .stage-caption {
    position: absolute; left: 6%; right: 6%; bottom: 8%;
    background: rgba(8, 11, 17, .72); border-radius: 10px; padding: 8px 10px;
    font-size: 12px; color: #dfe6f2;
  }
  .stage-caption b { color: #fff; }
  .stage-meta { font-size: 11px; color: var(--dim); }

  /* 两列控制台：各自滚动，页面不变长 */
  .panel {
    flex: 1 1 0;
    min-width: 220px;
    max-height: var(--stage-h);
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-right: 4px;
    scrollbar-gutter: stable;
  }

  .card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    background: var(--card);
    display: flex; flex-direction: column; gap: 10px;
    flex: 0 0 auto;
  }
  .card__title { font-size: 12px; font-weight: 600; color: var(--dim); letter-spacing: .6px; }
  .kv { display: flex; justify-content: space-between; font-size: 13px; }
  .kv span { color: var(--dim); }
  .kv b { font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px;
    font-size: 12px; color: var(--text); background: transparent;
  }
  .chip.active { border-color: var(--primary); background: rgba(110,168,254,.16); color: var(--primary); }
  .input {
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
    font-size: 12px; color: var(--dim); background: transparent;
  }
  .hint { font-size: 11px; color: var(--dim); line-height: 1.5; }
  .field { display: flex; align-items: center; gap: 10px; }
  .field > .label { flex: 0 0 44px; font-size: 12px; color: var(--dim); }
  .field > .control { flex: 1 1 auto; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }

  @media (max-width: 900px) {
    .layout { flex-direction: column; align-items: stretch; }
    .stage-wrap { position: static; align-self: center; }
    .stage { height: min(62vh, 560px); }
    .panel { flex: 0 0 auto; max-height: none; overflow: visible; padding-right: 0; }
  }
</style>
</head>
<body>
  <header class="page-header">
    <div>
      <h2 class="page-title">直播</h2>
      <div class="page-sub">宠物主播 · 本地预演</div>
    </div>
    <div class="header-actions">
      <span class="status">● 未开播</span>
      <button class="btn btn--primary">开播</button>
    </div>
  </header>

  <div class="layout">
    <section class="stage-wrap">
      <div class="stage">
        <div class="stage-pet"></div>
        <div class="stage-caption"><b>噜噜（水豚）</b> 大家好，我是噜噜（水豚）。今天想看点什</div>
      </div>
      <div class="stage-meta">9:16 · 宠物主播</div>
    </section>

    <!-- 控制列 -->
    <aside class="panel">
      <div class="card">
        <div class="card__title">场景</div>
        <div class="chips">
          <button class="chip active">宠物主播</button>
          <button class="chip">虚拟人单口</button>
          <button class="chip">任务实录</button>
          <button class="chip">游戏解说</button>
          <button class="chip">弹幕游戏</button>
          <button class="chip">虚拟人 + 宠物</button>
        </div>
      </div>

      <div class="card">
        <div class="card__title">状态</div>
        <div class="kv"><span>直播</span><b>未开播</b></div>
        <div class="kv"><span>推流</span><b>未推流</b></div>
        <div class="kv"><span>阶段</span><b>待机</b></div>
        <div class="kv"><span>字幕来源</span><b>系统语音</b></div>
      </div>

      <div class="card">
        <div class="card__title">形象</div>
        <div class="field">
          <span class="label">宠物</span>
          <div class="chips control">
            <button class="chip active">2D 精灵</button>
            <button class="chip">3D 模型</button>
          </div>
        </div>
        <div class="field">
          <span class="label"></span>
          <div class="input control">噜噜（水豚）▾</div>
        </div>
        <div class="field">
          <span class="label">大小</span>
          <input class="control" type="range" min="1.2" max="2.6" step="0.1" value="1.8">
        </div>
      </div>

      <div class="card">
        <div class="card__title">语音</div>
        <div class="field">
          <span class="control" style="font-size:12px">播报字幕</span>
          <span class="hint" style="margin-left:auto">念话中</span>
        </div>
        <div class="hint">没有本地语音包，播报会走 Edge 在线合成（需联网）</div>
        <div class="hint">当前引擎：系统语音（离线）</div>
      </div>
    </aside>

    <!-- 互动列 -->
    <aside class="panel">
      <div class="card">
        <div class="card__title">动作</div>
        <div class="actions">
          <button class="btn">摸摸</button>
          <button class="btn">招手</button>
          <button class="btn">张望</button>
          <button class="btn">转圈</button>
          <button class="btn">跳一跳</button>
        </div>
      </div>

      <div class="card">
        <div class="card__title">说话</div>
        <div class="input">输入一句，回车让宠物说</div>
        <div class="hint">开播后才能播报</div>
      </div>

      <div class="card">
        <div class="card__title">弹幕</div>
        <div class="input">模拟一条观众弹幕</div>
        <div class="actions">
          <button class="btn">发弹幕</button>
          <button class="btn">让它回应</button>
        </div>
        <div class="hint">提问会派到当前打开的会话，回答自动播报；没有打开的会话时不派发</div>
      </div>

      <div class="card">
        <div class="hint">录制会把当前舞台画面存成视频（能转 mp4 就转），落在系统的视频目录；推流实时推到平台，断流会自动重连（最多 5 次）。</div>
      </div>
    </aside>
  </div>
</body>
</html>
