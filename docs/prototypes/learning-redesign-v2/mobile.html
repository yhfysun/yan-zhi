<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学习模式全科目重构 · 移动端原型</title>
  <link rel="stylesheet" href="./prototype.css" />
</head>
<body>
  <div id="app"></div>
  <script src="./prototype-data.js"></script>
  <script src="./prototype-render.js"></script>
  <script>
    (function () {
      const app = document.querySelector('#app');
      const state = window.LearningProto.getQueryState();

      function render() {
        const subject = window.LearningProto.currentSubject(state);
        app.innerHTML = window.LearningProto.renderMobile(subject, state);
        window.LearningProto.bindCommon(app, state, render);
      }

      render();
    })();
  </script>
</body>
</html>
