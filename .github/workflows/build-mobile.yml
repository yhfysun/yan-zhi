name: 构建移动端

# Android APK 始终构建；iOS 始终产出模拟器包，配置 Apple 签名 secrets 后额外产出真机 IPA。
#
# ★★ 为什么这个 job 的步骤顺序不能改（每一步都在补一个「干净 checkout 下的坑」）：
#   1. apps/mobile/android/ 是 Capacitor 生成目录，**被 gitignore**
#      → 干净 runner 上不存在，必须先 `cap add android` 现生成；
#   2. 生成出来的工程是脚手架原样（青绿底 + 默认 brain 图标）
#      → 图标脚本必须**排在 cap add 之后**（否则 res/ 不存在，无从下笔）；
#   3. 短信插件的 java/manifest/MainActivity 注册只在 apps/mobile/native/android/
#      （tracked），重建工程后会丢 → 由 apply-native-sms.cjs 重新铺进去；
#   4. 内嵌后端（apps/mobile/nodejs）要 npm install 一遍才有效果
#      → 由 build-mobile-server.cjs 负责（含剥 .gz，避 gradle Duplicate resources）。
#   这几条正是 package.cjs 里 buildAndroid() 的链路，所以这里**直接复用同一脚本**，
#   而不是在 workflow 里再手写一遍 —— 本地怎么打、CI 就怎么打，避免两套口径漂移。

on:
  push:
    branches: [master, dev0.1, dev0.1-mobile]
    paths:
      # 只有碰了移动端（或它依赖的后端/共享包）才跑，避免每个桌面提交都烧 20 分钟
      - 'apps/mobile/**'
      - 'apps/server/**'
      - 'packages/core/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - 'scripts/package.cjs'
      - 'scripts/package-android.cjs'
      - 'assets/icons/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    # ★ 输出目录口径与本地一致：dist-release/android/<版本>/app-debug.apk
    #   （路径定义在 apps/desktop/scripts/lib/pack-helpers.cjs，脚本内部自行解析）
    #
    # ★ SDK / JDK 路径**不在这里硬编码**：
    #   · SDK 由 android-actions/setup-android 设置 ANDROID_SDK_ROOT 并加进 PATH；
    #   · JDK 由 actions/setup-java 设置 JAVA_HOME。
    #   （原先写死 /usr/local/lib/android/sdk，runner 布局一变就失效 —— 交给 action 更稳，
    #     且 scripts/package.cjs 的 androidToolchain() 会自动读这两个环境变量。）
    env:
      # 内嵌后端 npm install 走官方源即可（CI 直连网络，不需要国内镜像）
      YZ_SKIP_MOBILE_NPM: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      # ★ JDK 由 setup-java 显式提供并写进 JAVA_HOME，不依赖 runner 预装的默认版本 ——
      #   Cap 8 模板用 AGP 8.13.0，要求 JDK 17+；预装版本随镜像漂移，显式钉住更稳。
      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # ★ Android SDK：官方 action 负责下载 cmdline-tools + 接受许可 + 装 platform-tools，
      #   并把 sdkmanager 放进 PATH（README 实测：它在 $ANDROID_SDK_ROOT 或 $HOME/.android/sdk 查找）。
      #   这里只装 platform-tools，具体 platform / build-tools / ndk 在下一步按工程版本补。
      - name: 安装 Android SDK 基础工具
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 安装依赖
        run: pnpm install

      # Cap add 会在生成工程时同步一次 Web 资源；dist 不存在或为空时 Capacitor 直接失败。
      # 先产出真实 index.html，再生成 Android 工程。后面 package.cjs 仍会重新 build 最新产物。
      - name: 预构建移动端 Web 入口
        run: pnpm --filter @yan-zhi/mobile exec vite build

      # ★★ 生成 Android 原生工程（干净 runner 上不存在，因为 apps/mobile/android/ 被 gitignore）
      #   ★ 模板来自 @capacitor/cli 包内的 assets/android-template.tar.gz（随 npm 包本地分发），
      #     不联网，所以受限网络下也能生成。
      - name: 生成 Android 工程
        working-directory: apps/mobile
        run: node node_modules/@capacitor/cli/bin/capacitor add android

      # ★★ SDK 组件必须在「生成 Android 工程」**之后**准备 —— 顺序反了就装错版本：
      #   工程未生成时读不到 variables.gradle，只能按兜底值装（实测会与真实需求差一个版本）。
      #   Cap 8.5.2 模板实测：compileSdk 36 / targetSdk 36 / minSdk 24，AGP 8.13.0。
      #   NDK：@capawesome/capacitor-nodejs 有 CMakeLists.txt + externalNativeBuild（真的编译 native），
      #   且**未钉死 ndkVersion** → 用 AGP 8.13 的默认 NDK（27.x）。
      - name: 按工程版本补装 SDK 组件
        run: |
          set -euo pipefail
          # ★ 从**已生成**的工程里读真实版本，不在 workflow 里硬编码（会与工程漂移）
          GRADLE_VARS="apps/mobile/android/variables.gradle"
          if [ ! -f "$GRADLE_VARS" ]; then
            echo "::error::未找到 $GRADLE_VARS —— '生成 Android 工程' 步骤没生效"
            exit 1
          fi
          COMPILE_SDK=$(grep -oP 'compileSdkVersion\s*=\s*\K[0-9]+' "$GRADLE_VARS")
          TARGET_SDK=$(grep -oP 'targetSdkVersion\s*=\s*\K[0-9]+' "$GRADLE_VARS")
          MIN_SDK=$(grep -oP 'minSdkVersion\s*=\s*\K[0-9]+' "$GRADLE_VARS")
          echo "从 variables.gradle 读到: compileSdk=$COMPILE_SDK targetSdk=$TARGET_SDK minSdk=$MIN_SDK"
          echo "COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # build-tools 版本跟 compileSdk 同号（Android 官方发布节奏一致）；
          # NDK 27.0.12077973 是 AGP 8.13 的默认版本，与插件 CMake 编译对齐。
          sdkmanager --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${COMPILE_SDK}.0.0" \
            "ndk;27.0.12077973"
          echo "== 已安装 =="
          sdkmanager --list_installed | head -20

      # ★ 打包主链路（一条命令覆盖，与本地完全同一个口径）：
      #   gen-android-icons → vite build → apply-native-sms → 内嵌后端 → cap sync
      #   → gradle assembleDebug → 拷 APK
      #   这几步都在 scripts/package.cjs 的 buildAndroid() 里，**不在 workflow 重复实现** ——
      #   本地怎么打、CI 就怎么打，从根上避免两套口径漂移。
      #   ★ 上面单独跑 `cap add android` 是因为 package.cjs 假定工程已存在
      #     （本地开发机 cap add 过一次就一直在），而干净 runner 上没有。
      - name: 打包 Android APK
        run: node scripts/package-android.cjs --yes

      - name: 列出构建产物（诊断用）
        run: |
          echo "=== dist-release 树 ==="
          find dist-release -type f 2>/dev/null || echo "(空)"

      # ★ 路径口径由 pack-helpers.cjs 决定（dist-release/android/<版本>/），
      #   这里用通配匹配，避免 workflow 再记一份版本号。
      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: Android-APK
          path: dist-release/android/*/*.apk
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      CI: '1'
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      # @capawesome/capacitor-nodejs 的 postinstall 会在 macOS 下载 iOS NodeMobile.xcframework。
      - name: 安装依赖
        run: pnpm install

      - name: 构建服务端编译产物
        run: pnpm --filter @yan-zhi/server build

      - name: 构建移动端 Web 入口
        run: pnpm --filter @yan-zhi/mobile exec vite build

      - name: 生成 iOS 工程
        working-directory: apps/mobile
        run: node node_modules/@capacitor/cli/bin/capacitor add ios

      - name: 应用品牌图标
        working-directory: apps/mobile
        run: node scripts/gen-ios-icons.cjs

      - name: 打包内嵌 Node 后端
        working-directory: apps/mobile
        run: node scripts/build-mobile-server.cjs

      - name: 同步 Capacitor iOS 工程
        working-directory: apps/mobile
        run: node node_modules/@capacitor/cli/bin/capacitor sync ios

      - name: 解析 Swift Package 依赖
        working-directory: apps/mobile
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies

      - name: 构建 iOS 模拟器 App
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p dist-release/ios
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app \
            dist-release/ios/App-simulator.zip

      - name: 上传 iOS 模拟器 App
        uses: actions/upload-artifact@v7
        with:
          name: iOS-Simulator-App
          path: apps/mobile/dist-release/ios/App-simulator.zip
          if-no-files-found: error

      # 真机 IPA 必须使用 Apple Developer 证书和描述文件。
      # 未配置 secrets 时明确跳过模拟器以外的步骤，不伪造“可安装 IPA”。
      - name: 构建已签名真机 IPA（配置 secrets 时）
        working-directory: apps/mobile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_CERTIFICATE_P12_BASE64:-}" ] \
            || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${APPLE_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "IPA_READY=0" >> "$GITHUB_ENV"
            echo "::notice::未配置 Apple 签名 secrets，仅产出 iOS 模拟器 App，不生成不可安装的伪 IPA"
            exit 0
          fi

          BUNDLE_ID="${APPLE_BUNDLE_ID:-com.yanzhi.mobile}"
          KEYCHAIN="$RUNNER_TEMP/yan-zhi-ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          PROFILE_PATH="$RUNNER_TEMP/yan-zhi.mobileprovision"
          CERT_PATH="$RUNNER_TEMP/yan-zhi-cert.p12"
          PROFILE_PLIST="$RUNNER_TEMP/yan-zhi-profile.plist"
          EXPORT_PLIST="$RUNNER_TEMP/yan-zhi-export.plist"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          rm -rf build/ios-device dist-release/ios/device
          mkdir -p dist-release/ios/device
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios-device/App.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            -allowProvisioningUpdates \
            archive

          /usr/libexec/PlistBuddy -c 'Add :method string development' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$EXPORT_PLIST"
          xcodebuild \
            -exportArchive \
            -archivePath build/ios-device/App.xcarchive \
            -exportPath dist-release/ios/device \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -allowProvisioningUpdates
          IPA_FILE=$(find dist-release/ios/device -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_FILE"
          cp "$IPA_FILE" dist-release/ios/yan-zhi.ipa
          echo "IPA_READY=1" >> "$GITHUB_ENV"

      - name: 上传已签名真机 IPA
        if: env.IPA_READY == '1'
        uses: actions/upload-artifact@v7
        with:
          name: iOS-Signed-IPA
          path: apps/mobile/dist-release/ios/yan-zhi.ipa
          if-no-files-found: error

      - name: 清理临时钥匙串
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/yan-zhi-ios-signing.keychain-db" || true
