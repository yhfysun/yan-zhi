name: 构建桌面应用

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install

      - name: 构建 macOS 应用
        run: pnpm --filter @yan-zhi/desktop electron:build

      - name: 上传 DMG 安装包
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: apps/desktop/release/*.dmg

  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install

      - name: 构建 Windows 应用
        run: pnpm --filter @yan-zhi/desktop electron:build

      - name: 上传 NSIS 安装包
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: apps/desktop/release/*.exe
