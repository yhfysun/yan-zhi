name: 构建桌面应用

on:
  push:
    branches: [master, dev0.1, dev0.1-mobile]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    # 受限网络：可用仓库 Secrets 覆盖下载源 / pip 源（与本地 build-python-runtime.mjs 约定一致）
    env:
      YZ_PYTHON_STANDALONE_MIRROR: ${{ secrets.YZ_PYTHON_STANDALONE_MIRROR }}
      YZ_PIP_INDEX_URL: ${{ secrets.YZ_PIP_INDEX_URL || 'https://pypi.org/simple' }}
    # 注意：这里不能设 CSC_IDENTITY_AUTO_DISCOVERY=false。
    # arm64 macOS 要求应用内的每个原生二进制都签名（如 better-sqlite3 的 dylib），
    # 禁用自动发现会让 electron-builder 完全跳过签名，装出的 dmg 一启动就崩。
    # 不设该变量时，无证书环境会回退为 ad-hoc 签名，可正常分发（未公证，需右键打开）。
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install

      # 预置授权码「构建时现签」：私钥与签发脚本按设计不入库（.gitignore 授权码签发侧）。
      # CI 经仓库 Secrets 还原；未配置 secret → 显式 YZ_SKIP_LICENSE_SIGN=1 跳过预置码，
      # 运行时回退 license.ts 源码常量（2026-12-18 到期，之后需补配 secret 或签发机现签）。
      # 配置方式（签发机执行，base64 内容不含换行）：
      #   gh secret set LICENSE_PRIVATE_KEY_BASE64 < scripts/license-private-key.pem.b64
      #   gh secret set GEN_LICENSE_SCRIPT_BASE64 < scripts/gen-license.mjs.b64
      - name: 还原授权码签发材料（未配置 secret 则跳过预置码）
        shell: bash
        run: |
          if [ -z '${{ secrets.LICENSE_PRIVATE_KEY_BASE64 }}' ] || [ -z '${{ secrets.GEN_LICENSE_SCRIPT_BASE64 }}' ]; then
            echo "YZ_SKIP_LICENSE_SIGN=1" >> "$GITHUB_ENV"
            echo "::warning::未配置 LICENSE_PRIVATE_KEY_BASE64 / GEN_LICENSE_SCRIPT_BASE64 secret，本包不含预置试用码（运行时回退源码常量，2026-12-18 到期）"
            exit 0
          fi
          echo '${{ secrets.LICENSE_PRIVATE_KEY_BASE64 }}' | base64 -d > scripts/license-private-key.pem
          echo '${{ secrets.GEN_LICENSE_SCRIPT_BASE64 }}' | base64 -d > scripts/gen-license.mjs
          chmod +x scripts/gen-license.mjs
          echo "已还原签发私钥与签发脚本，打包时将现签预置码"

      # 版本档（lite / basic / pro）由 `electron:build:*` 脚本内部的 set-edition.cjs 写入
      # apps/desktop/edition.json，无需在此额外设置 env —— 产物名后缀由 electron-build.cjs
      # 自动注入 YZ_ARTIFACT_SUFFIX。本 workflow 只出基础版包（mac 侧同样如此）。
      - name: 构建 macOS 基础版
        run: pnpm --filter @yan-zhi/desktop electron:build:basic

      - name: 列出构建产物（诊断用）
        run: |
          echo "=== dist-release 树 ==="; find dist-release -type f 2>/dev/null || echo "(空)"

      - name: 上传 macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: macOS-DMG
          # 统一产物树：dist-release/desktop/<档>/<版本>/（见 apps/desktop/scripts/lib/pack-helpers.cjs）
          path: dist-release/desktop/*/*/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # 受限网络：可用仓库 Secrets 覆盖下载源 / pip 源（与本地 build-python-runtime.mjs 约定一致）
      YZ_PYTHON_STANDALONE_MIRROR: ${{ secrets.YZ_PYTHON_STANDALONE_MIRROR }}
      YZ_PIP_INDEX_URL: ${{ secrets.YZ_PIP_INDEX_URL || 'https://pypi.org/simple' }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      # better-sqlite3 / cpu-features 等原生模块在 Windows 上无 Node 24 预编译包，
      # 会回退本机编译；windows-latest 自带 VS 但 node-gyp 认不出 VS2025，
      # 用本 action 注入 VS 环境（设置 VSINSTALLDIR 等）让编译能找到 MSVC。
      - name: 准备 MSVC 工具链（原生模块本机编译）
        uses: ilammy/msvc-dev-cmd@v1

      - name: 安装依赖
        run: pnpm install

      - name: 还原授权码签发材料（未配置 secret 则跳过预置码）
        shell: bash
        run: |
          if [ -z '${{ secrets.LICENSE_PRIVATE_KEY_BASE64 }}' ] || [ -z '${{ secrets.GEN_LICENSE_SCRIPT_BASE64 }}' ]; then
            echo "YZ_SKIP_LICENSE_SIGN=1" >> "$GITHUB_ENV"
            echo "::warning::未配置 LICENSE_PRIVATE_KEY_BASE64 / GEN_LICENSE_SCRIPT_BASE64 secret，本包不含预置试用码（运行时回退源码常量，2026-12-18 到期）"
            exit 0
          fi
          echo '${{ secrets.LICENSE_PRIVATE_KEY_BASE64 }}' | base64 -d > scripts/license-private-key.pem
          echo '${{ secrets.GEN_LICENSE_SCRIPT_BASE64 }}' | base64 -d > scripts/gen-license.mjs
          chmod +x scripts/gen-license.mjs
          echo "已还原签发私钥与签发脚本，打包时将现签预置码"

      - name: 构建 Windows 基础版
        run: pnpm --filter @yan-zhi/desktop electron:build:basic

      - name: 列出构建产物（诊断用）
        shell: pwsh
        run: |
          Write-Output "=== dist-release 树 ==="
          Get-ChildItem -Path dist-release -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName,Length | Format-Table -AutoSize

      - name: 上传 NSIS 安装包
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Installer
          # 统一产物树：dist-release/desktop/<档>/<版本>/（见 apps/desktop/scripts/lib/pack-helpers.cjs）
          path: dist-release/desktop/*/*/*.exe
          if-no-files-found: error
