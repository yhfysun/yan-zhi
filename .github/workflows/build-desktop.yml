name: 构建桌面应用

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install

      - name: 下载内置模型（qwen + bge，模型不进 git，构建前需补齐）
        run: pnpm --filter @yan-zhi/server download:models

      - name: 构建 macOS 完整版
        run: pnpm --filter @yan-zhi/desktop electron:build:full

      - name: 构建 macOS 轻量版
        run: pnpm --filter @yan-zhi/desktop electron:build:lite

      - name: 上传 macOS DMG（完整版）
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG-full
          path: apps/desktop/release/*.dmg

      - name: 上传 macOS DMG（轻量版）
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG-lite
          path: apps/desktop/release-lite/*.dmg

  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install

      - name: 下载内置模型（qwen + bge，模型不进 git，构建前需补齐）
        run: pnpm --filter @yan-zhi/server download:models

      - name: 构建 Windows 完整版
        run: pnpm --filter @yan-zhi/desktop electron:build:full

      - name: 构建 Windows 轻量版
        run: pnpm --filter @yan-zhi/desktop electron:build:lite

      - name: 上传 NSIS 安装包（完整版）
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer-full
          path: apps/desktop/release/*.exe

      - name: 上传 NSIS 安装包（轻量版）
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer-lite
          path: apps/desktop/release-lite/*.exe
