name: 构建桌面应用

on:
  push:
    branches: [master, dev0.1]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    # 受限网络：可用仓库 Secrets 覆盖下载源 / pip 源（与本地 build-python-runtime.mjs 约定一致）
    env:
      YZ_PYTHON_STANDALONE_MIRROR: ${{ secrets.YZ_PYTHON_STANDALONE_MIRROR }}
      YZ_PIP_INDEX_URL: ${{ secrets.YZ_PIP_INDEX_URL || 'https://pypi.org/simple' }}
    # 注意：这里不能设 CSC_IDENTITY_AUTO_DISCOVERY=false。
    # arm64 macOS 要求应用内的每个原生二进制都签名（如 better-sqlite3 的 dylib），
    # 禁用自动发现会让 electron-builder 完全跳过签名，装出的 dmg 一启动就崩。
    # 不设该变量时，无证书环境会回退为 ad-hoc 签名，可正常分发（未公证，需右键打开）。
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install


      - name: 构建 macOS 轻量版
        run: pnpm --filter @yan-zhi/desktop electron:build:lite

      - name: 列出构建产物（诊断用）
        run: |
          echo "=== dist-release ==="; ls -la dist-release 2>/dev/null || echo "(空)"

      - name: 上传 macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: macOS-DMG
          path: dist-release/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # 受限网络：可用仓库 Secrets 覆盖下载源 / pip 源（与本地 build-python-runtime.mjs 约定一致）
      YZ_PYTHON_STANDALONE_MIRROR: ${{ secrets.YZ_PYTHON_STANDALONE_MIRROR }}
      YZ_PIP_INDEX_URL: ${{ secrets.YZ_PIP_INDEX_URL || 'https://pypi.org/simple' }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install


      - name: 构建 Windows 轻量版
        run: pnpm --filter @yan-zhi/desktop electron:build:lite

      - name: 列出构建产物（诊断用）
        shell: pwsh
        run: |
          Write-Output "=== dist-release ==="
          Get-ChildItem -Path dist-release -ErrorAction SilentlyContinue | Select-Object Name,Length | Format-Table -AutoSize

      - name: 上传 NSIS 安装包
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Installer
          path: dist-release/*.exe
          if-no-files-found: error
