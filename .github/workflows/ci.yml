name: CI

on:
  push:
    branches: [master, dev0.1, dev0.1-mobile]
  pull_request:
    branches: [master, dev0.1, dev0.1-mobile]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      YZ_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install

      - name: 类型检查（typecheck）
        run: pnpm typecheck

      # dist-* / workflow-session-guard 等测试直接验证编译产物；干净 runner 上必须先生成 dist。
      - name: 构建服务端编译产物
        run: pnpm --filter @yan-zhi/server build

      - name: 单元测试（core + server）
        run: pnpm --filter @yan-zhi/core --filter @yan-zhi/server test

      # desktop 用 node --test（该包不依赖 vitest）。当前覆盖 keyring 敏感值加解密：
      # 兼容语义（旧明文照常读 / 密文解不开显式失败）在真机上几乎无法构造验证，只能靠单测钉住。
      - name: 单元测试（desktop）
        # xvfb 让“真 Electron 真页面”场景在无桌面的 Ubuntu runner 上仍能真跑，不是跳过。
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run -a pnpm --filter @yan-zhi/desktop test
